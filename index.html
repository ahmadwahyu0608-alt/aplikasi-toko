<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Toko Kasir</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B4332">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F4EF; --surface:#FFFFFF; --surface-2:#ECE9DE;
    --ink:#1C1C1A; --ink-soft:#6E6C61;
    --primary:#1B4332; --primary-light:#2D6A4F;
    --accent:#C89B3C; --accent-soft:#F1E2BB;
    --danger:#B3261E; --border:#E2DFD2;
    --radius:16px;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-tap-highlight-color:transparent;}
  #app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden;}
  h1,h2,h3{font-family:var(--font-display);margin:0;}
  button{font-family:var(--font-body);cursor:pointer;border:none;}
  input,select{font-family:var(--font-body);}
  .mono{font-family:var(--font-mono);}
  .hidden{display:none !important;}

  /* ---------- LOGIN ---------- */
  #login-view{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;background:var(--primary);}
  .login-card{background:var(--surface);border-radius:24px;padding:32px 24px;width:100%;box-shadow:0 20px 40px rgba(0,0,0,.25);}
  .login-logo{width:56px;height:56px;margin:0 auto 16px;display:block;}
  .login-card h1{text-align:center;font-size:22px;color:var(--primary);margin-bottom:4px;}
  .login-card p{text-align:center;color:var(--ink-soft);font-size:13px;margin:0 0 24px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
  .field input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;background:var(--bg);}
  .field select{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;background:var(--bg);color:var(--ink);}
  .field input:focus,.field select:focus{outline:none;border-color:var(--primary-light);}
  .btn-primary{width:100%;padding:13px;background:var(--primary);color:#fff;border-radius:10px;font-weight:600;font-size:15px;margin-top:6px;}
  .btn-primary:active{background:var(--primary-light);}
  .btn-primary:disabled{opacity:.5;}
  .login-error{color:var(--danger);font-size:13px;margin-top:10px;text-align:center;}
  .login-hint{margin-top:18px;font-size:11px;color:var(--ink-soft);text-align:center;line-height:1.6;}

  /* ---------- TOPBAR ---------- */
  .topbar{background:var(--primary);color:#fff;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  .topbar .brand{font-family:var(--font-display);font-size:17px;font-weight:600;}
  .topbar .role-badge{font-size:10px;background:rgba(255,255,255,.15);padding:3px 9px;border-radius:20px;margin-left:8px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;vertical-align:middle;}
  .topbar .logout{background:none;color:rgba(255,255,255,.85);font-size:13px;font-weight:600;padding:6px;}

  /* ---------- CONTENT ---------- */
  #content{flex:1;overflow-y:auto;padding:16px;padding-bottom:90px;}

  /* ---------- KASIR: search + chips ---------- */
  .search-box{position:relative;margin-bottom:12px;}
  .search-box input{width:100%;padding:11px 14px 11px 38px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);font-size:14px;}
  .search-box::before{content:'⌕';position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-size:16px;}
  .chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;}
  .chip{flex-shrink:0;padding:6px 14px;border-radius:20px;background:var(--surface-2);color:var(--ink-soft);font-size:12.5px;font-weight:600;border:1.5px solid transparent;}
  .chip.active{background:var(--primary);color:#fff;}

  .product-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .product-card{background:var(--surface);border-radius:var(--radius);padding:12px;border:1px solid var(--border);position:relative;}
  .product-card .pname{font-weight:600;font-size:13.5px;line-height:1.3;min-height:35px;}
  .product-card .pstock{font-size:10.5px;color:var(--ink-soft);margin-top:4px;}
  .product-card .pstock.low{color:var(--danger);font-weight:600;}
  .product-card .pprice{font-family:var(--font-mono);font-weight:600;color:var(--primary);margin-top:8px;font-size:14px;}
  .product-card .add-btn{position:absolute;right:10px;bottom:10px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-size:18px;line-height:1;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .product-card .add-btn:active{background:var(--primary);}
  .product-card.out-of-stock{opacity:.5;}
  .product-card.out-of-stock .add-btn{background:var(--ink-soft);pointer-events:none;}

  .empty-state{text-align:center;color:var(--ink-soft);padding:60px 20px;font-size:14px;}

  /* ---------- FLOATING CART BAR ---------- */
  #cart-bar{position:absolute;left:0;right:0;bottom:64px;max-width:480px;margin:0 auto;background:var(--primary);color:#fff;padding:13px 18px;display:flex;justify-content:space-between;align-items:center;border-radius:14px 14px 0 0;box-shadow:0 -6px 18px rgba(0,0,0,.15);}
  #cart-bar .cart-count{font-size:12px;opacity:.85;}
  #cart-bar .cart-total{font-family:var(--font-mono);font-weight:600;font-size:16px;}
  #cart-bar button{background:var(--accent);color:#fff;padding:8px 16px;border-radius:8px;font-weight:600;font-size:13px;}

  /* ---------- BOTTOM NAV ---------- */
  #bottom-nav{flex-shrink:0;display:flex;background:var(--surface);border-top:1px solid var(--border);height:64px;}
  #bottom-nav button{flex:1;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-soft);font-size:10.5px;font-weight:600;}
  #bottom-nav button .icon{font-size:19px;}
  #bottom-nav button.active{color:var(--primary);}

  /* ---------- SHEET / MODAL ---------- */
  .overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;z-index:20;}
  .sheet{background:var(--bg);width:100%;max-height:88%;border-radius:20px 20px 0 0;padding:18px;overflow-y:auto;position:relative;}
  .sheet-handle{width:36px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 14px;}
  .sheet h2{font-size:18px;margin-bottom:14px;}

  /* receipt-style cart list */
  .receipt{background:var(--surface);border-radius:10px 10px 0 0;padding:14px 16px 20px;position:relative;margin-bottom:14px;}
  .receipt::after{content:'';position:absolute;left:0;right:0;bottom:-9px;height:18px;
    background:
      linear-gradient(-45deg, var(--bg) 9px, transparent 0) 0 0/18px 18px,
      linear-gradient(45deg, var(--bg) 9px, transparent 0) 0 0/18px 18px;
    background-color:var(--surface);
  }
  .receipt-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--border);gap:8px;}
  .receipt-item:last-child{border-bottom:none;}
  .ri-name{font-size:13px;font-weight:600;flex:1;}
  .ri-qty{display:flex;align-items:center;gap:8px;}
  .ri-qty button{width:24px;height:24px;border-radius:50%;background:var(--surface-2);font-weight:700;color:var(--primary);}
  .ri-qty span{font-family:var(--font-mono);font-size:13px;min-width:16px;text-align:center;}
  .ri-sub{font-family:var(--font-mono);font-size:13px;font-weight:600;min-width:70px;text-align:right;}
  .receipt-total{display:flex;justify-content:space-between;align-items:center;padding-top:24px;font-weight:700;}
  .receipt-total .val{font-family:var(--font-mono);font-size:18px;color:var(--primary);}

  .pay-row{display:flex;justify-content:space-between;padding:10px 0;font-size:14px;}
  .pay-row .val{font-family:var(--font-mono);font-weight:600;}
  .pay-row.kembalian .val{color:var(--accent);font-size:17px;}

  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}

  .icon-btn-small{background:none;color:var(--ink-soft);font-size:13px;padding:6px;text-decoration:underline;}

  .close-sheet{position:absolute;right:16px;top:14px;background:none;font-size:20px;color:var(--ink-soft);}

  /* ---------- CARDS / TABLES generic ---------- */
  .card{background:var(--surface);border-radius:var(--radius);padding:14px 16px;border:1px solid var(--border);margin-bottom:10px;}
  .row-between{display:flex;justify-content:space-between;align-items:center;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .stat-card{background:var(--primary);color:#fff;border-radius:var(--radius);padding:14px;}
  .stat-card .label{font-size:11px;opacity:.8;margin-bottom:4px;}
  .stat-card .value{font-family:var(--font-mono);font-size:18px;font-weight:600;}
  .stat-card.accent{background:var(--accent);}

  .section-title{font-size:13px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .bar-row .bar-label{width:76px;font-size:11px;color:var(--ink-soft);flex-shrink:0;}
  .bar-track{flex:1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--primary);border-radius:4px;}
  .bar-row .bar-val{font-family:var(--font-mono);font-size:11.5px;width:60px;text-align:right;flex-shrink:0;}

  .stat-grid.three{grid-template-columns:1fr 1fr;}
  .stat-card.light{background:var(--surface);color:var(--ink);border:1px solid var(--border);}
  .stat-card.light .label{color:var(--ink-soft);opacity:1;}
  .stat-card .sub{font-size:11px;opacity:.85;margin-top:3px;}
  .margin-row{padding:10px 0;border-bottom:1px dashed var(--border);}
  .margin-row:last-child{border-bottom:none;}
  .margin-row .mr-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .margin-row .mr-name{font-size:13px;font-weight:600;}
  .margin-row .mr-laba{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--primary);}
  .margin-row .mr-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);margin-top:3px;}
  .margin-row .mr-meta .pct{font-family:var(--font-mono);font-weight:600;}
  .pct.low{color:var(--danger);}
  .pct.good{color:var(--primary-light);}
  .seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;margin-bottom:14px;}
  .seg button{flex:1;padding:9px;border-radius:9px;background:none;font-weight:600;font-size:13px;color:var(--ink-soft);}
  .seg button.active{background:var(--surface);color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.1);}
  .stok-pill{font-size:10px;padding:3px 9px;border-radius:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;flex-shrink:0;}
  .stok-pill.habis{background:#F6D5D2;color:var(--danger);}
  .stok-pill.menipis{background:var(--accent-soft);color:#7A5A12;}
  .stok-pill.aman{background:#D9EBDF;color:var(--primary-light);}
  .stok-big{font-family:var(--font-mono);font-size:20px;font-weight:600;color:var(--primary);}
  .mv-line{display:flex;gap:14px;font-size:11.5px;color:var(--ink-soft);margin-top:8px;font-family:var(--font-mono);}
  .mv-line .plus{color:var(--primary-light);font-weight:600;}
  .mv-line .minus{color:var(--danger);font-weight:600;}
  .field select option{color:var(--ink);}
  .btn-secondary{width:100%;padding:13px;background:var(--surface-2);color:var(--primary);border-radius:10px;font-weight:600;font-size:15px;margin-top:8px;}
  .nota{background:#fff;color:#000;font-family:var(--font-mono);font-size:12px;line-height:1.5;padding:16px 14px;border-radius:8px;max-width:320px;margin:0 auto 14px;border:1px solid var(--border);}
  .nota .c{text-align:center;}
  .nota .b{font-weight:600;}
  .nota hr{border:none;border-top:1px dashed #000;margin:8px 0;}
  .nota .r{display:flex;justify-content:space-between;gap:8px;}
  .nota .it{margin-bottom:4px;}
  .nota .big{font-size:14px;font-weight:600;}
  #print-area{display:none;}
  @media print{
    html,body{background:#fff !important;height:auto !important;overflow:visible !important;}
    #app,#toast-root{display:none !important;}
    #print-area{display:block !important;}
    #print-area .nota{border:none;border-radius:0;max-width:none;width:100%;margin:0;padding:2mm 3mm;font-size:11px;}
    @page{margin:0;}
  }
  .kredit-box{background:var(--accent-soft);border-radius:12px;padding:12px 12px 2px;margin:4px 0 12px;}
  .kredit-warn{font-size:12.5px;color:#6A4C0F;margin-bottom:10px;line-height:1.45;}
  .pt-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;}
  .pt-row.sel{border-color:var(--accent);background:var(--accent-soft);}
  .fab{position:absolute;right:18px;bottom:80px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;font-size:26px;box-shadow:0 8px 20px rgba(0,0,0,.25);z-index:15;}

  .badge{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--surface-2);color:var(--ink-soft);font-weight:600;}

  .toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:50;box-shadow:0 8px 20px rgba(0,0,0,.2);}
</style>
</head>
<body>
<div id="app">

  <!-- LOGIN -->
  <div id="login-view">
    <div class="login-card">
      <svg class="login-logo" viewBox="0 0 192 192"><rect width="192" height="192" rx="36" fill="#1B4332"/><path d="M50 70h92l-8 62a10 10 0 0 1-10 8.6H68a10 10 0 0 1-10-8.6L50 70Z" fill="#F7F7F4"/><path d="M66 70v-8a30 30 0 0 1 60 0v8" stroke="#C89B3C" stroke-width="9" fill="none" stroke-linecap="round"/><circle cx="80" cy="98" r="6" fill="#C89B3C"/><circle cx="112" cy="98" r="6" fill="#C89B3C"/></svg>
      <h1>Toko Kasir</h1>
      <p>Masuk untuk mulai transaksi</p>
      <div class="field"><label>Username</label><input id="login-username" autocomplete="username"></div>
      <div class="field"><label>Password</label><input id="login-password" type="password" autocomplete="current-password"></div>
      <button class="btn-primary" id="login-btn">Masuk</button>
      <div class="login-error hidden" id="login-error"></div>
      <button class="btn-primary" id="demo-btn" style="background:var(--accent);">Coba mode demo (tanpa Google Sheet)</button>
      <div class="login-hint">Mode demo memakai data contoh. Untuk data asli, atur <code>API_URL</code> di bagian atas script.<br>Di mode demo, login juga bisa pakai <b>owner/owner123</b> atau <b>kasir/kasir123</b>.</div>
    </div>
  </div>

  <!-- MAIN -->
  <div id="main-view" class="hidden" style="display:flex;flex-direction:column;height:100%;">
    <div class="topbar">
      <div><span class="brand" id="topbar-title">Kasir</span><span class="role-badge" id="topbar-role"></span></div>
      <button class="logout" id="logout-btn">Keluar</button>
    </div>
    <div id="content"></div>
    <div id="cart-bar" class="hidden">
      <div><div class="cart-count" id="cart-count">0 item</div><div class="cart-total mono" id="cart-total">Rp0</div></div>
      <button id="open-cart-btn">Lihat Keranjang</button>
    </div>
    <div id="bottom-nav"></div>
  </div>

  <div id="sheet-root"></div>
  <div id="toast-root"></div>
</div>
<div id="print-area"></div>

<script>
/* ======================= KONFIGURASI ======================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbzxq2X8EWn42HfJ85Kk73Bqa9oJP0xDRgX7Pl6TC5rWjjRNNkWA9-vcfkluGzlqpoM/exec';

/* Identitas toko yang tercetak di nota. Ganti sesuai toko Anda. */
const TOKO = {
  nama: 'Nama Toko Anda',
  alamat: 'Alamat toko Anda',
  telp: '08xx-xxxx-xxxx',
  footer: 'Terima kasih sudah berbelanja',
  lebarKertas: '58mm'   // ganti '80mm' jika printer struk Anda 80mm
};

/* Daftar kategori barang (tampil sebagai dropdown di form barang). Ubah/tambah di sini jika perlu. */
const KATEGORI = [
  'Sembako','Bumbu dapur','Minuman','Produk Kebersihan','Makanan Ringan','Perlengkapan RT',
  'Gas','Obat','Keperluan Bayi','Alat Tulis Kantor','Layanan Digital','Lainnya'
];

/* ======================= STATE ======================= */
let state = {
  user: null,
  barang: [],
  cart: [],
  view: 'kasir',
  search: '',
  kategori: 'Semua',
  laporan: null,
  laporanTab: 'penjualan',
  laporanStok: null,
  stokFilter: 'Semua',
  masuk: [],
  pelanggan: [],
  piutang: null,
  piutangCari: '',
  laporanPiutang: null,
  laporanRange: { mulai: '', sampai: '' },
  riwayat: []
};

/* ======================= HELPERS ======================= */
function rupiah(n){ return 'Rp' + Math.round(Number(n)||0).toLocaleString('id-ID'); }
function el(id){ return document.getElementById(id); }
function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg){
  const root = el('toast-root');
  root.innerHTML = `<div class="toast">${msg}</div>`;
  setTimeout(()=>{ root.innerHTML=''; }, 2200);
}

/* ---------- MODE DEMO (data contoh di memori) ---------- */
let DEMO = false;
const demoDB = {
  users:[
    {Username:'owner',Password:'owner123',Nama:'Pemilik Toko',Role:'owner'},
    {Username:'kasir',Password:'kasir123',Nama:'Kasir 1',Role:'kasir'}
  ],
  barang:[
    {ID:1,Nama:'Indomie Goreng',Kategori:'Sembako',HargaBeli:2500,HargaJual:3000,Stok:48,Satuan:'pcs'},
    {ID:2,Nama:'Aqua 600ml',Kategori:'Minuman',HargaBeli:2800,HargaJual:4000,Stok:30,Satuan:'btl'},
    {ID:3,Nama:'Teh Botol Sosro',Kategori:'Minuman',HargaBeli:4000,HargaJual:5500,Stok:20,Satuan:'btl'},
    {ID:4,Nama:'Beras 5kg',Kategori:'Sembako',HargaBeli:58000,HargaJual:65000,Stok:12,Satuan:'karung'},
    {ID:5,Nama:'Minyak Goreng 1L',Kategori:'Sembako',HargaBeli:16000,HargaJual:18500,Stok:4,Satuan:'btl'},
    {ID:6,Nama:'Gula Pasir 1kg',Kategori:'Sembako',HargaBeli:14000,HargaJual:16000,Stok:15,Satuan:'kg'},
    {ID:7,Nama:'Kopi Kapal Api',Kategori:'Minuman',HargaBeli:1200,HargaJual:2000,Stok:60,Satuan:'sachet'},
    {ID:8,Nama:'Sabun Lifebuoy',Kategori:'Produk Kebersihan',HargaBeli:3000,HargaJual:4000,Stok:0,Satuan:'pcs'}
  ],
  transaksi:[], detail:[], masuk:[], pelanggan:[], pelunasan:[]
};
(function seedDemo(){
  const d=demoDB; let tid=1, did=1;
  d.pelanggan.push({ID:1,Nama:'Bu Siti',Telepon:'081234567890'},{ID:2,Nama:'Pak Budi',Telepon:'082111222333'},{ID:3,Nama:'Warung Maju',Telepon:''});
  const addTx=(hari,items,bayar,pid)=>{
    const tgl=new Date(Date.now()-hari*86400000).toISOString();
    let total=0;
    items.forEach(([bid,qty])=>{
      const b=d.barang.find(x=>x.ID===bid);
      d.detail.push({ID:did++,TransaksiID:tid,BarangID:bid,NamaBarang:b.Nama,Qty:qty,HargaSatuan:b.HargaJual,Subtotal:qty*b.HargaJual,HargaBeli:b.HargaBeli});
      total+=qty*b.HargaJual;
    });
    const pl=d.pelanggan.find(x=>x.ID===pid);
    const bay=bayar==null?total:bayar;
    d.transaksi.push({ID:tid,Tanggal:tgl,Kasir:'Kasir 1',TotalItem:items.length,TotalBayar:total,Bayar:bay,Kembalian:Math.max(bay-total,0),PelangganID:pid||'',NamaPelanggan:pl?pl.Nama:'',Sisa:Math.max(total-bay,0)});
    tid++;
  };
  addTx(0,[[1,5],[2,2]]); addTx(1,[[4,1],[7,6]]); addTx(1,[[3,3],[6,2]]); addTx(2,[[1,10],[7,8]]);
  addTx(3,[[5,1],[2,4]]); addTx(4,[[4,2],[6,1],[3,2]]); addTx(5,[[2,6],[1,4]]);

function demoApi(action, p){
  const d = demoDB;
  const nextId = a => a.reduce((m,x)=>Math.max(m,Number(x.ID)||0),0)+1;
  const openPiutang=()=>{
    const o={};
    d.transaksi.forEach(t=>{
      if((t.Sisa||0)<=0) return;
      const pl=d.pelanggan.find(x=>x.ID===t.PelangganID)||{};
      const e=o[t.PelangganID]||(o[t.PelangganID]={id:t.PelangganID,nama:pl.Nama||t.NamaPelanggan,telepon:pl.Telepon||'',total:0,transaksi:[]});
      e.total+=t.Sisa; e.transaksi.push({id:t.ID,tanggal:t.Tanggal,total:t.TotalBayar,sisa:t.Sisa});
    });
    return Object.values(o).map(e=>{ e.transaksi.sort((a,b)=>a.tanggal.localeCompare(b.tanggal)); e.tertua=e.transaksi[0].tanggal; e.jumlahTransaksi=e.transaksi.length; return e; }).sort((a,b)=>b.total-a.total);
  };
  if(action==='login'){
    const u = d.users.find(x=>x.Username===p.username && x.Password===p.password);
    return u ? {success:true,nama:u.Nama,role:u.Role,username:u.Username} : {success:false,message:'Username atau password salah'};
  }
  if(action==='getBarang') return {success:true,data:d.barang.map(x=>({...x}))};
  if(action==='addBarang'){ const id=nextId(d.barang); d.barang.push({...p.barang,ID:id}); return {success:true,id}; }
  if(action==='updateBarang'){ const i=d.barang.findIndex(x=>Number(x.ID)===Number(p.barang.ID)); if(i<0) return {success:false,message:'Barang tidak ditemukan'}; d.barang[i]={...p.barang}; return {success:true}; }
  if(action==='deleteBarang'){ d.barang=d.barang.filter(x=>Number(x.ID)!==Number(p.id)); return {success:true}; }
  if(action==='checkout'){
    const total=p.items.reduce((s,i)=>s+i.qty*i.harga,0);
    const bayar=Number(p.bayar)||0;
    const sisa=Math.max(total-bayar,0);
    let pel=null;
    if(sisa>0){
      if(p.pelangganId) pel=d.pelanggan.find(x=>Number(x.ID)===Number(p.pelangganId))||null;
      if(!pel && p.pelangganBaru && String(p.pelangganBaru.nama||'').trim()){
        const nm=String(p.pelangganBaru.nama).trim();
        pel=d.pelanggan.find(x=>x.Nama.toLowerCase()===nm.toLowerCase());
        if(!pel){ pel={ID:nextId(d.pelanggan),Nama:nm,Telepon:p.pelangganBaru.telepon||''}; d.pelanggan.push(pel); }
      }
      if(!pel) return {success:false,message:'Pilih atau isi nama pelanggan untuk pembayaran yang kurang'};
    }
    const id=nextId(d.transaksi);
    d.transaksi.push({ID:id,Tanggal:new Date().toISOString(),Kasir:p.kasir,TotalItem:p.items.length,TotalBayar:total,Bayar:bayar,Kembalian:Math.max(bayar-total,0),PelangganID:pel?pel.ID:'',NamaPelanggan:pel?pel.Nama:'',Sisa:sisa});
    p.items.forEach(i=>{
      d.detail.push({ID:nextId(d.detail),TransaksiID:id,BarangID:i.id,NamaBarang:i.nama,Qty:i.qty,HargaSatuan:i.harga,Subtotal:i.qty*i.harga,HargaBeli:(d.barang.find(x=>Number(x.ID)===Number(i.id))||{}).HargaBeli||0});
      const b=d.barang.find(x=>Number(x.ID)===Number(i.id)); if(b) b.Stok=Number(b.Stok)-i.qty;
    });
    return {success:true,transaksiId:id,total,kembalian:Math.max(bayar-total,0),sisa,pelangganId:pel?pel.ID:'',pelanggan:pel?pel.Nama:''};
  }
  if(action==='addBarangMasuk'){
    const q=Number(p.qty);
    const b=d.barang.find(x=>Number(x.ID)===Number(p.barangId));
    if(!b||!(q>0)) return {success:false,message:'Pilih barang dan isi jumlah masuk'};
    b.Stok=Number(b.Stok)+q;
    const hb=Number(p.hargaBeli)>0?Number(p.hargaBeli):b.HargaBeli;
    if(Number(p.hargaBeli)>0) b.HargaBeli=hb;
    d.masuk.push({ID:nextId(d.masuk),Tanggal:new Date().toISOString(),BarangID:b.ID,NamaBarang:b.Nama,Qty:q,HargaBeli:hb,Supplier:p.supplier||'',Catatan:p.catatan||'',Petugas:p.petugas||''});
    return {success:true,stokBaru:b.Stok};
  }
  if(action==='getBarangMasuk') return {success:true,data:[...d.masuk].reverse()};
  if(action==='getLaporanStok'){
    const day=t=>t.slice(0,10);
    const inR=t=>(!p.mulai||day(t)>=p.mulai)&&(!p.sampai||day(t)<=p.sampai);
    const after=t=>!!p.sampai&&day(t)>p.sampai;
    const tgl={}; d.transaksi.forEach(t=>tgl[t.ID]=t.Tanggal);
    const mv={}; const g=id=>mv[id]||(mv[id]={masuk:0,keluar:0,mS:0,kS:0});
    d.masuk.forEach(m=>{const o=g(m.BarangID); if(after(m.Tanggal)) o.mS+=m.Qty; else if(inR(m.Tanggal)) o.masuk+=m.Qty;});
    d.detail.forEach(x=>{const t=tgl[x.TransaksiID]; if(!t) return; const o=g(x.BarangID); if(after(t)) o.kS+=x.Qty; else if(inR(t)) o.keluar+=x.Qty;});
    const ord={habis:0,menipis:1,aman:2}; let nilai=0,habis=0,menipis=0;
    const items=d.barang.map(b=>{
      const o=mv[b.ID]||{masuk:0,keluar:0,mS:0,kS:0};
      const akhir=Number(b.Stok)-o.mS+o.kS, awal=akhir-o.masuk+o.keluar;
      const nv=Math.max(akhir,0)*b.HargaBeli; const st=akhir<=0?'habis':(akhir<=5?'menipis':'aman');
      nilai+=nv; if(st==='habis') habis++; if(st==='menipis') menipis++;
      return {id:b.ID,nama:b.Nama,kategori:b.Kategori,satuan:b.Satuan,hargaBeli:b.HargaBeli,stokAwal:awal,masuk:o.masuk,keluar:o.keluar,stokAkhir:akhir,nilai:nv,status:st};
    }).sort((a,b)=>(ord[a.status]-ord[b.status])||a.nama.localeCompare(b.nama));
    return {success:true,data:{totalNilai:nilai,jumlahBarang:items.length,habis,menipis,items}};
  }
  if(action==='getNota'){
    const t=d.transaksi.find(x=>Number(x.ID)===Number(p.id));
    if(!t) return {success:false,message:'Transaksi tidak ditemukan'};
    const items=d.detail.filter(x=>Number(x.TransaksiID)===Number(p.id)).map(x=>({nama:x.NamaBarang,qty:x.Qty,harga:x.HargaSatuan,subtotal:x.Subtotal}));
    const pelunasan=d.pelunasan.filter(x=>Number(x.TransaksiID)===Number(p.id)).map(x=>({tanggal:x.Tanggal,jumlah:x.Jumlah}));
    return {success:true,data:{id:t.ID,tanggal:t.Tanggal,kasir:t.Kasir,total:t.TotalBayar,bayar:t.Bayar,kembalian:t.Kembalian,pelanggan:t.NamaPelanggan||'',sisa:t.Sisa||0,kredit:!!t.PelangganID&&t.Bayar<t.TotalBayar,pelunasan,items}};
  }
  if(action==='getPelanggan'){
    const pi={}; d.transaksi.forEach(t=>{ if((t.Sisa||0)>0) pi[t.PelangganID]=(pi[t.PelangganID]||0)+t.Sisa; });
    return {success:true,data:d.pelanggan.map(x=>({ID:x.ID,Nama:x.Nama,Telepon:x.Telepon,piutang:pi[x.ID]||0})).sort((a,b)=>a.Nama.localeCompare(b.Nama))};
  }
  if(action==='getPiutang'){
    const items=openPiutang();
    return {success:true,data:{totalPiutang:items.reduce((s,i)=>s+i.total,0),jumlahPelanggan:items.length,items}};
  }
  if(action==='getPelunasan'){
    return {success:true,data:d.pelunasan.filter(x=>!p.pelangganId||Number(x.PelangganID)===Number(p.pelangganId)).slice().reverse()};
  }
  if(action==='bayarPiutang'){
    const j=Number(p.jumlah), pid=Number(p.pelangganId);
    if(!pid) return {success:false,message:'Pilih pelanggan'};
    if(!(j>0)) return {success:false,message:'Isi jumlah pembayaran'};
    const pel=d.pelanggan.find(x=>x.ID===pid)||{Nama:''};
    const rows=d.transaksi.filter(t=>Number(t.PelangganID)===pid&&(t.Sisa||0)>0).sort((a,b)=>a.Tanggal.localeCompare(b.Tanggal));
    if(!rows.length) return {success:false,message:'Pelanggan ini tidak punya piutang'};
    const totalOpen=rows.reduce((s,t)=>s+t.Sisa,0);
    const sasaran=p.transaksiId?rows.filter(t=>Number(t.ID)===Number(p.transaksiId)):rows;
    if(!sasaran.length) return {success:false,message:'Transaksi tidak ditemukan atau sudah lunas'};
    const batas=sasaran.reduce((s,t)=>s+t.Sisa,0);
    if(j>batas) return {success:false,message:'Jumlah melebihi sisa piutang (Rp '+batas+')'};
    let sisaBayar=j; const alokasi=[];
    sasaran.forEach(t=>{
      if(sisaBayar<=0) return;
      const pakai=Math.min(t.Sisa,sisaBayar); t.Sisa-=pakai; sisaBayar-=pakai;
      alokasi.push({transaksiId:t.ID,jumlah:pakai});
      d.pelunasan.push({ID:nextId(d.pelunasan),Tanggal:new Date().toISOString(),PelangganID:pid,NamaPelanggan:pel.Nama,TransaksiID:t.ID,Jumlah:pakai,Catatan:p.catatan||'',Petugas:p.petugas||''});
    });
    return {success:true,dibayar:j,sisaPiutang:totalOpen-j,alokasi};
  }
  if(action==='getLaporanPiutang'){
    const now=Date.now(); const items=openPiutang();
    const aging=[{label:'0–7 hari',total:0},{label:'8–30 hari',total:0},{label:'Lebih dari 30 hari',total:0}];
    items.forEach(i=>i.transaksi.forEach(t=>{ const u=Math.floor((now-new Date(t.tanggal))/86400000); aging[u<=7?0:(u<=30?1:2)].total+=t.sisa; }));
    const day=x=>x.slice(0,10); const inR=x=>(!p.mulai||day(x)>=p.mulai)&&(!p.sampai||day(x)<=p.sampai);
    const baru=d.transaksi.filter(t=>inR(t.Tanggal)&&t.PelangganID&&t.Bayar<t.TotalBayar).reduce((s,t)=>s+t.TotalBayar-t.Bayar,0);
    const pl=d.pelunasan.filter(x=>inR(x.Tanggal));
    return {success:true,data:{totalPiutang:items.reduce((s,i)=>s+i.total,0),jumlahPelanggan:items.length,aging,
      pelanggan:items.map(i=>({id:i.id,nama:i.nama,total:i.total,jumlahTransaksi:i.jumlahTransaksi,umurTertua:Math.floor((now-new Date(i.tertua))/86400000)})),
      piutangBaru:baru,pelunasanDiterima:pl.reduce((s,x)=>s+x.Jumlah,0),jumlahPelunasan:pl.length,daftarPelunasan:pl.slice().reverse().slice(0,50)}};
  }
  if(action==='getTransaksi') return {success:true,data:[...d.transaksi].reverse()};
  if(action==='getLaporan'){
    const tr=d.transaksi.filter(t=>{
      const day=t.Tanggal.slice(0,10);
      return (!p.mulai||day>=p.mulai)&&(!p.sampai||day<=p.sampai);
    });
    const byId={}; tr.forEach(t=>byId[t.ID]=t);
    const det=d.detail.filter(x=>byId[x.TransaksiID]);
    const pb={}, ph={}; let tp=0, tm=0;
    det.forEach(x=>{
      const modal=x.HargaBeli*x.Qty;
      tp+=x.Subtotal; tm+=modal;
      const o=pb[x.NamaBarang]||(pb[x.NamaBarang]={nama:x.NamaBarang,qty:0,penjualan:0,modal:0});
      o.qty+=x.Qty; o.penjualan+=x.Subtotal; o.modal+=modal;
      const day=byId[x.TransaksiID].Tanggal.slice(0,10);
      const h=ph[day]||(ph[day]={tanggal:day,penjualan:0,modal:0});
      h.penjualan+=x.Subtotal; h.modal+=modal;
    });
    const hit=o=>{o.laba=o.penjualan-o.modal;o.margin=o.penjualan?Math.round(o.laba/o.penjualan*1000)/10:0;return o;};
    const rekap=Object.values(pb).map(hit).sort((a,b)=>b.laba-a.laba);
    return {success:true,data:{totalPenjualan:tp,totalModal:tm,totalLaba:tp-tm,marginPersen:tp?Math.round((tp-tm)/tp*1000)/10:0,jumlahTransaksi:tr.length,belumTertagih:tr.reduce((s,t)=>s+(t.Sisa||0),0),rataRata:tr.length?Math.round(tp/tr.length):0,terlaris:[...rekap].sort((a,b)=>b.qty-a.qty).slice(0,10),rekapBarang:rekap,perHari:Object.keys(ph).sort().map(k=>hit(ph[k]))}};
  }
  return {success:false,message:'Aksi tidak dikenal'};
}

async function apiGet(action, params={}){
  if(DEMO) return demoApi(action, params);
  const qs = new URLSearchParams({action, ...params}).toString();
  const res = await fetch(`${API_URL}?${qs}`);
  return res.json();
}
async function apiPost(action, payload={}){
  if(DEMO) return demoApi(action, payload);
  const res = await fetch(API_URL, {
    method:'POST',
    headers: {'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action, ...payload})
  });
  return res.json();
}

async function doLogin(){
  const username = el('login-username').value.trim();
  const password = el('login-password').value;
  const errBox = el('login-error');
  errBox.classList.add('hidden');
  if(!username || !password){ errBox.textContent='Isi username dan password'; errBox.classList.remove('hidden'); return; }
  if(!DEMO && API_URL.includes('PASTE_URL')){ errBox.textContent='API_URL belum diatur di dalam file index.html'; errBox.classList.remove('hidden'); return; }

  el('login-btn').disabled = true; el('login-btn').textContent = 'Memeriksa...';
  try{
    const res = await apiPost('login', {username, password});
    if(res.success){
      state.user = res;
      await bootMain();
    } else {
      errBox.textContent = res.message || 'Gagal masuk';
      errBox.classList.remove('hidden');
    }
  }catch(err){
    errBox.textContent = 'Tidak bisa menghubungi server. Cek API_URL & koneksi internet.';
    errBox.classList.remove('hidden');
  }
  el('login-btn').disabled = false; el('login-btn').textContent = 'Masuk';
}

   saat mengetik, supaya fokus & keyboard tidak hilang. Hanya daftar barang yang diperbarui. */
function renderKasir(){
  refreshCartBar();

    <div class="search-box"><input id="search-input" placeholder="Cari barang..." value="${esc(state.search)}" autocomplete="off"></div>

  `;

  });
  renderKasirChips();

function renderKasirChips(){
  const box = el('kasir-chips'); if(!box) return;
  const kategoris = ['Semua', ...new Set(state.barang.map(b=>b.Kategori).filter(Boolean))];
  box.innerHTML = kategoris.map(k=>`<button class="chip ${k===state.kategori?'active':''}" data-k="${esc(k)}">${esc(k)}</button>`).join('');
  box.querySelectorAll('.chip').forEach(c=> c.addEventListener('click', ()=>{
    state.kategori = c.dataset.k;
    renderKasirChips();
    renderKasirGrid();
  }));
}

function renderKasirGrid(){
  const box = el('kasir-grid'); if(!box) return;
  // beberapa kata boleh dicari sekaligus, misalnya "indo gor" menemukan "Indomie Goreng"
  const kata = state.search.toLowerCase().split(/\s+/).filter(Boolean);
  const filtered = state.barang.filter(b=>{
    const nama = String(b.Nama).toLowerCase();
    const cocokNama = kata.every(k=> nama.includes(k));
    const cocokKategori = state.kategori==='Semua' || b.Kategori===state.kategori;
    return cocokNama && cocokKategori;
  });
  if(filtered.length===0){
    const sedangCari = kata.length>0 || state.kategori!=='Semua';
    box.innerHTML = `<div class="empty-state">${sedangCari ? 'Barang tidak ditemukan.' : 'Belum ada barang.<br>Tambahkan barang dulu di tab Barang.'}</div>`;
    return;
  }
  box.innerHTML = `<div class="product-grid">
    ${filtered.map(b=>{
      const stok = Number(b.Stok);
      return `<div class="product-card ${stok<=0?'out-of-stock':''}" data-id="${b.ID}">
        <div class="pname">${esc(b.Nama)}</div>
        <div class="pstock ${stok<=5?'low':''}">Stok: ${stok} ${esc(b.Satuan||'')}</div>
        <div class="pprice mono">${rupiah(b.HargaJual)}</div>
        <button class="add-btn" data-id="${b.ID}">+</button>
      </div>`;
    }).join('')}
  </div>`;
  box.querySelectorAll('.add-btn').forEach(b=> b.addEventListener('click', ()=> addToCart(b.dataset.id)));
}

function addToCart(id){
  const barang = state.barang.find(b=> String(b.ID)===String(id));
  if(!barang || Number(barang.Stok)<=0) return;
  const existing = state.cart.find(c=> String(c.id)===String(id));
  const qtyInCart = existing ? existing.qty : 0;
  if(qtyInCart+1 > Number(barang.Stok)){ showToast('Stok tidak cukup'); return; }
  if(existing) existing.qty += 1;
  else state.cart.push({id: barang.ID, nama: barang.Nama, harga: Number(barang.HargaJual), qty:1, stokMax: Number(barang.Stok)});
  refreshCartBar();
}

function updateCartBar(){
  const totalItem = state.cart.reduce((s,c)=>s+c.qty,0);
  const total = state.cart.reduce((s,c)=>s+c.qty*c.harga,0);
  el('cart-count').textContent = `${totalItem} item`;
  el('cart-total').textContent = rupiah(total);
}

el('open-cart-btn').addEventListener('click', openCartSheet);

function openCartSheet(){
  const total = state.cart.reduce((s,c)=>s+c.qty*c.harga,0);
  el('sheet-root').innerHTML = `
    <div class="overlay" id="cart-overlay">
      <div class="sheet">
        <button class="close-sheet" id="close-cart">✕</button>
        <div class="sheet-handle"></div>
        <h2>Keranjang</h2>
        <div class="receipt">
          ${state.cart.map(c=>`
            <div class="receipt-item" data-id="${c.id}">
              <div class="ri-name">${c.nama}</div>
              <div class="ri-qty">
                <button class="qty-dec" data-id="${c.id}">−</button>
                <span>${c.qty}</span>
                <button class="qty-inc" data-id="${c.id}">+</button>
              </div>
              <div class="ri-sub mono">${rupiah(c.qty*c.harga)}</div>
            </div>`).join('')}
          <div class="receipt-total"><span>Total</span><span class="val mono">${rupiah(total)}</span></div>
        </div>
        <button class="btn-primary" id="checkout-btn" ${state.cart.length===0?'disabled':''}>Bayar</button>
      </div>
    </div>
  `;
  el('close-cart').addEventListener('click', ()=> el('sheet-root').innerHTML='');
  el('cart-overlay').addEventListener('click', (e)=>{ if(e.target.id==='cart-overlay') el('sheet-root').innerHTML=''; });
  el('sheet-root').querySelectorAll('.qty-inc').forEach(b=>b.addEventListener('click', ()=> changeQty(b.dataset.id, 1)));
  el('sheet-root').querySelectorAll('.qty-dec').forEach(b=>b.addEventListener('click', ()=> changeQty(b.dataset.id, -1)));
  el('checkout-btn').addEventListener('click', openPaymentSheet);
}

function changeQty(id, delta){
  const item = state.cart.find(c=> String(c.id)===String(id));
  if(!item) return;
  item.qty += delta;
  if(item.qty > item.stokMax){ item.qty = item.stokMax; showToast('Stok tidak cukup'); }
  if(item.qty <= 0) state.cart = state.cart.filter(c=> String(c.id)!==String(id));
  refreshCartBar();
  openCartSheet();
}

function openPaymentSheet(){
  const total = state.cart.reduce((s,c)=>s+c.qty*c.harga,0);
  el('sheet-root').innerHTML = `
    <div class="overlay" id="pay-overlay">
      <div class="sheet">
        <button class="close-sheet" id="close-pay">✕</button>
        <div class="sheet-handle"></div>
        <h2>Pembayaran</h2>
        <div class="pay-row"><span>Total belanja</span><span class="val mono">${rupiah(total)}</span></div>
        <div class="field"><label>Uang diterima</label><input id="bayar-input" inputmode="numeric" placeholder="0"></div>
        <div class="pay-row kembalian"><span id="kembalian-label">Kembalian</span><span class="val mono" id="kembalian-val">Rp0</span></div>
        <div id="kredit-box" class="kredit-box hidden">
          <div class="kredit-warn">Pembayaran kurang dari total. Sisanya dicatat sebagai <b>piutang</b> pelanggan.</div>
          <div class="field"><label>Pelanggan</label>
            <select id="p-pel">
              <option value="">Pilih pelanggan</option>
              ${state.pelanggan.map(p=>`<option value="${p.ID}">${esc(p.Nama)}${p.piutang>0?' · piutang '+rupiah(p.piutang):''}</option>`).join('')}
              <option value="baru">+ Pelanggan baru</option>
            </select>
          </div>
          <div id="p-baru" class="hidden">
            <div class="field"><label>Nama pelanggan</label><input id="p-nama"></div>
            <div class="field"><label>No. telepon (opsional)</label><input id="p-telp" inputmode="tel"></div>
          </div>
        </div>
        <button class="btn-primary" id="confirm-pay-btn">Selesaikan Transaksi</button>
      </div>
    </div>
  `;
  const baca = ()=> Number(el('bayar-input').value.replace(/\D/g,'')) || 0;
  const tampil = (paksa)=>{
    const terisi = el('bayar-input').value.trim() !== '';
    const bayar = baca();
    const kurang = (terisi || paksa) && bayar < total;
    el('kredit-box').classList.toggle('hidden', !kurang);
    el('kembalian-label').textContent = kurang ? 'Sisa piutang' : 'Kembalian';
    el('kembalian-val').textContent = rupiah(kurang ? total-bayar : Math.max(bayar-total,0));
    el('confirm-pay-btn').textContent = kurang ? 'Simpan sebagai Piutang' : 'Selesaikan Transaksi';
  };
  el('close-pay').addEventListener('click', ()=> el('sheet-root').innerHTML='');
  el('pay-overlay').addEventListener('click', (e)=>{ if(e.target.id==='pay-overlay') el('sheet-root').innerHTML=''; });
  el('bayar-input').addEventListener('input', ()=> tampil(false));
  el('p-pel').addEventListener('change', ()=> el('p-baru').classList.toggle('hidden', el('p-pel').value!=='baru'));
  el('confirm-pay-btn').addEventListener('click', ()=>{
    if(baca() < total && el('kredit-box').classList.contains('hidden')){
      // kolom uang diterima kosong: seluruh belanja akan jadi piutang, minta pelanggan dulu
      tampil(true);
      showToast('Pilih pelanggan untuk dicatat sebagai piutang');
      return;
    }
    finalisasiTransaksi(total);
  });
}

async function finalisasiTransaksi(total){
  const bayar = Number(el('bayar-input').value.replace(/\D/g,'')) || 0;
  const kurang = bayar < total;
  let pel = {};
  if(kurang){
    const sel = el('p-pel').value;
    if(!sel){ showToast('Pilih pelanggan untuk piutang'); return; }
    if(sel==='baru'){
      const nama = el('p-nama').value.trim();
      if(!nama){ showToast('Isi nama pelanggan'); return; }
      pel = {pelangganBaru:{nama, telepon: el('p-telp').value.trim()}};
    } else pel = {pelangganId: sel};
  }
  el('confirm-pay-btn').disabled = true; el('confirm-pay-btn').textContent = 'Memproses...';
  try{
    const res = await apiPost('checkout', {
      kasir: state.user.nama,
      items: state.cart.map(c=>({id:c.id, nama:c.nama, qty:c.qty, harga:c.harga})),
      bayar, ...pel
    });
    if(res.success){
      const nota = {
        id: res.transaksiId, tanggal: new Date().toISOString(), kasir: state.user.nama,
        items: state.cart.map(c=>({nama:c.nama, qty:c.qty, harga:c.harga, subtotal:c.qty*c.harga})),
        total, bayar, kembalian: res.kembalian,
        kredit: kurang, sisa: res.sisa||0, pelanggan: res.pelanggan||'', pelunasan: []
      };
      state.cart.forEach(c=>{
        const b = state.barang.find(x=> String(x.ID)===String(c.id));
        if(b) b.Stok = Number(b.Stok) - c.qty;
      });
      state.cart = [];
      state.laporanStok = null;
      renderKasir();
      openNotaSheet(nota, 'baru');
      if(kurang) apiGet('getPelanggan').then(r=>{ state.pelanggan = r.data || state.pelanggan; }).catch(()=>{});
      return;
    } else {
      showToast(res.message || 'Transaksi gagal');
    }
  }catch(err){
    showToast('Gagal menghubungi server');
  }
  const btn = el('confirm-pay-btn');
  if(btn){ btn.disabled=false; btn.textContent = kurang ? 'Simpan sebagai Piutang' : 'Selesaikan Transaksi'; }
}

        <div class="field"><label>Kategori</label>
          <select id="f-kategori">
            <option value="">Pilih kategori</option>
            ${(()=>{
              const cur = existing ? (existing.Kategori||'') : '';
              const opts = (cur && !KATEGORI.includes(cur)) ? [...KATEGORI, cur] : KATEGORI;
              return opts.map(k=>`<option value="${k}" ${k===cur?'selected':''}>${k}</option>`).join('');
            })()}

        </div>
        <div class="field-row">
          <div class="field"><label>Stok</label><input id="f-stok" inputmode="numeric" value="${existing?existing.Stok:''}"></div>
          <div class="field"><label>Satuan</label><input id="f-satuan" value="${existing?existing.Satuan||'pcs':'pcs'}"></div>
        </div>
        <button class="btn-primary" id="save-barang-btn">Simpan</button>
      </div>
    </div>
  `;
  el('close-barang').addEventListener('click', ()=> el('sheet-root').innerHTML='');
  el('barang-overlay').addEventListener('click', (e)=>{ if(e.target.id==='barang-overlay') el('sheet-root').innerHTML=''; });
  el('save-barang-btn').addEventListener('click', ()=> simpanBarang(existing));
}

async function simpanBarang(existing){
  const payload = {
    ID: existing?existing.ID:undefined,
    Nama: el('f-nama').value.trim(),
    Kategori: el('f-kategori').value.trim(),
    HargaBeli: Number(el('f-hargabeli').value)||0,
    HargaJual: Number(el('f-hargajual').value)||0,
    Stok: Number(el('f-stok').value)||0,
    Satuan: el('f-satuan').value.trim()||'pcs'
  };
  if(!payload.Nama){ showToast('Nama barang wajib diisi'); return; }
  if(!payload.Kategori){ showToast('Pilih kategori barang'); return; }
  const btn = el('save-barang-btn'); btn.disabled=true; btn.textContent='Menyimpan...';
  try{
    const res = existing ? await apiPost('updateBarang',{barang:payload}) : await apiPost('addBarang',{barang:payload});
    if(res.success){
      const data = await apiGet('getBarang');
      state.barang = data.data || [];
      el('sheet-root').innerHTML = '';
      showToast('Barang tersimpan');
      renderBarang();
    } else showToast(res.message || 'Gagal menyimpan');
  }catch(err){ showToast('Gagal menghubungi server'); }
  if(btn){ btn.disabled=false; btn.textContent='Simpan'; }
}

async function hapusBarang(id){
  if(!confirm('Hapus barang ini?')) return;
  const res = await apiPost('deleteBarang',{id});
  if(res.success){
    state.barang = state.barang.filter(b=> String(b.ID)!==String(id));
    showToast('Barang dihapus');
    renderBarang();
  } else showToast(res.message||'Gagal menghapus');
}

function openMasukForm(){
  if(state.barang.length===0){ showToast('Tambahkan barang dulu di tab Barang'); return; }
  const sorted = [...state.barang].sort((a,b)=> String(a.Nama).localeCompare(String(b.Nama)));
  el('sheet-root').innerHTML = `
    <div class="overlay" id="masuk-overlay">
      <div class="sheet">
        <button class="close-sheet" id="close-masuk">✕</button>
        <div class="sheet-handle"></div>
        <h2>Catat Barang Masuk</h2>
        <div class="field"><label>Barang</label>
          <select id="m-barang">

            ${sorted.map(b=>`<option value="${b.ID}">${esc(b.Nama)} (stok ${b.Stok})</option>`).join('')}
          </select>
        </div>
        <div class="field-row">
          <div class="field"><label>Jumlah masuk</label><input id="m-qty" inputmode="numeric" placeholder="0"></div>
          <div class="field"><label>Harga beli / satuan</label><input id="m-harga" inputmode="numeric" placeholder="0"></div>
        </div>
        <div class="field"><label>Supplier (opsional)</label><input id="m-supplier"></div>
        <div class="field"><label>Catatan (opsional)</label><input id="m-catatan"></div>
        <div class="pay-row"><span>Stok setelah masuk</span><span class="val mono" id="m-preview">-</span></div>
        <div style="font-size:11px;color:var(--ink-soft);margin-bottom:6px;">Harga beli yang diisi akan memperbarui harga beli barang ini untuk perhitungan margin berikutnya.</div>
        <button class="btn-primary" id="save-masuk-btn">Simpan & Tambah Stok</button>
      </div>
    </div>
  `;

    const b = state.barang.find(x=> String(x.ID)===el('m-barang').value);
    const q = Number(el('m-qty').value.replace(/\D/g,''))||0;
    el('m-preview').textContent = b ? `${Number(b.Stok)} → ${Number(b.Stok)+q} ${b.Satuan||''}` : '-';
  };
  el('close-masuk').addEventListener('click', ()=> el('sheet-root').innerHTML='');
  el('masuk-overlay').addEventListener('click', (e)=>{ if(e.target.id==='masuk-overlay') el('sheet-root').innerHTML=''; });
  el('m-barang').addEventListener('change', ()=>{
    const b = state.barang.find(x=> String(x.ID)===el('m-barang').value);
    el('m-harga').value = b ? (b.HargaBeli||'') : '';
    upd();
  });
  el('m-qty').addEventListener('input', upd);
  el('save-masuk-btn').addEventListener('click', simpanMasuk);

async function simpanMasuk(){
  const barangId = el('m-barang').value;
  const qty = Number(el('m-qty').value.replace(/\D/g,''))||0;
  const hargaBeli = Number(el('m-harga').value.replace(/\D/g,''))||0;
  if(!barangId){ showToast('Pilih barang dulu'); return; }
  if(qty<=0){ showToast('Isi jumlah barang masuk'); return; }
  const b = state.barang.find(x=> String(x.ID)===barangId);
  const btn = el('save-masuk-btn'); btn.disabled=true; btn.textContent='Menyimpan...';
  try{
    const res = await apiPost('addBarangMasuk',{
      barangId, qty, hargaBeli,
      supplier: el('m-supplier').value.trim(),
      catatan: el('m-catatan').value.trim(),
      petugas: state.user.nama
    });
    if(res.success){
      const data = await apiGet('getBarang');
      state.barang = data.data || [];
      state.laporanStok = null;
      el('sheet-root').innerHTML = '';
      showToast(`Stok ${b.Nama} bertambah ${qty}`);
      renderMasuk();
    } else showToast(res.message || 'Gagal menyimpan');
  }catch(err){ showToast('Gagal menghubungi server'); }
  const again = el('save-masuk-btn');
  if(again){ again.disabled=false; again.textContent='Simpan & Tambah Stok'; }
}

/* ======================= PIUTANG & PELUNASAN ======================= */
function umurHari(iso){ return Math.max(0, Math.floor((Date.now()-new Date(iso).getTime())/86400000)); }

  el('cart-bar').classList.add('hidden');
  el('content').innerHTML = `

  `;
  el('piutang-cari').addEventListener('input', (e)=>{ state.piutangCari = e.target.value; tampilkanDaftarPiutang(); });
  muatPiutang();
}

async function muatPiutang(){
  try{
    const res = await apiGet('getPiutang');

    state.piutang = res.data;

  const q = state.piutangCari.toLowerCase();
  const items = d.items.filter(i=> String(i.nama).toLowerCase().includes(q));
  el('piutang-list').innerHTML = items.length===0
    ? `<div class="empty-state">${d.items.length===0 ? 'Tidak ada piutang. Semua transaksi sudah lunas.' : 'Pelanggan tidak ditemukan.'}</div>`
    : items.map(i=>{
      const umur = umurHari(i.tertua);
      return `<div class="card piutang-card" data-id="${i.id}" style="cursor:pointer;">
        <div class="row-between" style="gap:10px;">
          <div style="min-width:0;">
            <div style="font-weight:600;font-size:14px;">${esc(i.nama)}</div>

        </div>
        <div style="margin-top:8px;font-size:12px;font-weight:600;color:var(--primary-light);">Terima pelunasan →</div>
      </div>`;
    }).join('');
  el('piutang-list').querySelectorAll('.piutang-card').forEach(c=> c.addEventListener('click', ()=> openPiutangDetail(c.dataset.id)));
}

            <div style="text-align:right;">
              <div class="mono" style="font-weight:700;color:var(--danger);">${rupiah(t.sisa)}</div>
              <div style="font-size:10.5px;color:var(--ink-soft);">dari ${rupiah(t.total)}</div>
            </div>
          </div>`).join('')}
        <div id="pt-hint" style="font-size:11.5px;color:var(--ink-soft);margin:6px 0 14px;line-height:1.5;"></div>
        <div class="field"><label>Jumlah dibayar</label><input id="pt-jumlah" inputmode="numeric" placeholder="0"></div>
        <button class="btn-secondary" id="pt-isi" style="margin:-4px 0 12px;"></button>
        <div class="field"><label>Catatan (opsional)</label><input id="pt-catatan"></div>
        <div class="pay-row kembalian"><span>Sisa piutang setelah bayar</span><span class="val mono" id="pt-sisa"></span></div>
        <button class="btn-primary" id="pt-simpan">Terima Pembayaran</button>
        <div class="section-title">Riwayat pelunasan</div>
        <div id="pt-riwayat"><div style="font-size:12px;color:var(--ink-soft);">Memuat...</div></div>
      </div>
    </div>
  `;
  const batas = ()=>{
    if(target==null) return p.total;
    const t = p.transaksi.find(x=> String(x.id)===String(target));
    return t ? t.sisa : p.total;
  };
  const baca = ()=> Number(el('pt-jumlah').value.replace(/\D/g,'')) || 0;
  const perbarui = ()=>{
    el('pt-hint').textContent = target==null
      ? 'Pembayaran otomatis dialokasikan ke transaksi terlama dulu. Ketuk satu transaksi di atas untuk melunasi transaksi itu saja.'
      : `Pembayaran hanya untuk transaksi #${target}. Ketuk lagi untuk membatalkan pilihan.`;
    el('pt-isi').textContent = `Isi sebesar sisa (${rupiah(batas())})`;
    el('pt-sisa').textContent = rupiah(Math.max(p.total - Math.min(baca(), batas()), 0));
    el('sheet-root').querySelectorAll('.pt-row').forEach(r=> r.classList.toggle('sel', String(r.dataset.tid)===String(target)));
  };
  const tutup = ()=>{ el('sheet-root').innerHTML=''; };
  el('close-pt').addEventListener('click', tutup);
  el('pt-overlay').addEventListener('click', (e)=>{ if(e.target.id==='pt-overlay') tutup(); });
  el('sheet-root').querySelectorAll('.pt-row').forEach(r=> r.addEventListener('click', ()=>{
    target = (String(target)===String(r.dataset.tid)) ? null : r.dataset.tid;
    perbarui();
  }));
  el('pt-jumlah').addEventListener('input', perbarui);
  el('pt-isi').addEventListener('click', ()=>{ el('pt-jumlah').value = batas(); perbarui(); });
  el('pt-simpan').addEventListener('click', async ()=>{
    const jumlah = baca();
    if(jumlah<=0){ showToast('Isi jumlah pembayaran'); return; }
    if(jumlah>batas()){ showToast('Jumlah melebihi sisa piutang'); return; }
    const btn = el('pt-simpan'); btn.disabled=true; btn.textContent='Menyimpan...';
    try{
      const res = await apiPost('bayarPiutang', {
        pelangganId: p.id, jumlah, transaksiId: target || '',
        catatan: el('pt-catatan').value.trim(), petugas: state.user.nama
      });
      if(res.success){
        tutup();
        showToast(`Pelunasan ${rupiah(jumlah)} diterima · sisa ${rupiah(res.sisaPiutang)}`);
        state.laporanPiutang = null;
        apiGet('getPelanggan').then(r=>{ state.pelanggan = r.data || state.pelanggan; }).catch(()=>{});
        muatPiutang();
        return;
      }
      showToast(res.message || 'Gagal menyimpan pelunasan');
    }catch(err){ showToast('Gagal menghubungi server'); }
    const again = el('pt-simpan'); if(again){ again.disabled=false; again.textContent='Terima Pembayaran'; }
  });
  perbarui();

  // riwayat pelunasan pelanggan ini
  try{
    const r = await apiGet('getPelunasan', {pelangganId: p.id});
    const list = (r.data||[]).slice(0,10);
    const box = el('pt-riwayat'); if(!box) return;
    box.innerHTML = list.length===0 ? '<div style="font-size:12px;color:var(--ink-soft);">Belum ada pelunasan.</div>' : list.map(x=>`
      <div class="margin-row">
        <div class="mr-top"><span class="mr-name">${fmtTanggalNota(x.Tanggal)}</span><span class="mr-laba">${rupiah(x.Jumlah)}</span></div>
        <div class="mr-meta"><span>untuk transaksi #${x.TransaksiID}${x.Catatan?' · '+esc(x.Catatan):''}</span></div>
      </div>`).join('');
  }catch(err){}
}

/* ======================= LAPORAN VIEW ======================= */
function renderLaporan(){
  el('cart-bar').classList.add('hidden');
  if(el('fab-barang')) el('fab-barang').classList.add('hidden');
  const tab = state.laporanTab;
  el('content').innerHTML = `
    <div class="seg">
      <button data-tab="penjualan" class="${tab==='penjualan'?'active':''}">Penjualan</button>
      <button data-tab="stok" class="${tab==='stok'?'active':''}">Stok Produk</button>
      <button data-tab="piutang" class="${tab==='piutang'?'active':''}">Piutang</button>
    </div>
    <div class="field-row">
      <div class="field"><label>Dari tanggal</label><input type="date" id="lap-mulai" value="${state.laporanRange.mulai}"></div>
      <div class="field"><label>Sampai tanggal</label><input type="date" id="lap-sampai" value="${state.laporanRange.sampai}"></div>
    </div>
    <button class="btn-primary" id="lap-terapkan">Tampilkan Laporan</button>
    <div id="lap-hasil" style="margin-top:16px;"></div>
  `;
  el('content').querySelectorAll('.seg button').forEach(b=> b.addEventListener('click', ()=>{
    state.laporanRange.mulai = el('lap-mulai').value;
    state.laporanRange.sampai = el('lap-sampai').value;
    state.laporanTab = b.dataset.tab;
    renderLaporan();
  }));
  el('lap-terapkan').addEventListener('click', muatLaporan);
  if(tab==='stok' || tab==='piutang') muatLaporan();   // stok & piutang selalu diambil terbaru
  else if(state.laporan) tampilkanLaporan();
}

async function muatLaporan(){
  state.laporanRange.mulai = el('lap-mulai').value;
  state.laporanRange.sampai = el('lap-sampai').value;
  const tab = state.laporanTab;
  const aksi = {penjualan:'getLaporan', stok:'getLaporanStok', piutang:'getLaporanPiutang'}[tab];
  const btn = el('lap-terapkan');
  btn.textContent = 'Memuat...';
  try{
    const res = await apiGet(aksi, state.laporanRange);
    if(!res.success){ showToast(res.message || 'Gagal memuat laporan'); }
    else if(tab !== state.laporanTab){ /* tab sudah berganti, abaikan */ }
    else if(tab==='stok'){ state.laporanStok = res.data; tampilkanLaporanStok(); }
    else if(tab==='piutang'){ state.laporanPiutang = res.data; tampilkanLaporanPiutang(); }
    else { state.laporan = res.data; tampilkanLaporan(); }
  }catch(err){ showToast('Gagal menghubungi server'); }
  if(el('lap-terapkan')) el('lap-terapkan').textContent = 'Tampilkan Laporan';
}

function tampilkanLaporanPiutang(){
  const d = state.laporanPiutang; if(!d) return;
  const maxAging = Math.max(1, ...d.aging.map(a=>a.total));
  el('lap-hasil').innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="label">Total Piutang Saat Ini</div><div class="value">${rupiah(d.totalPiutang)}</div><div class="sub">${d.jumlahPelanggan} pelanggan</div></div>
      <div class="stat-card accent"><div class="label">Pelunasan Diterima</div><div class="value">${rupiah(d.pelunasanDiterima)}</div><div class="sub">${d.jumlahPelunasan} pembayaran</div></div>
      <div class="stat-card light" style="grid-column:span 2;"><div class="label">Piutang Baru di Periode Ini</div><div class="value">${rupiah(d.piutangBaru)}</div></div>
    </div>

    <div class="section-title">Umur Piutang</div>
    <div class="card">${d.aging.map((a,i)=>`
      <div class="margin-row">
        <div class="mr-top"><span class="mr-name">${a.label}</span><span class="mr-laba" ${i===2&&a.total>0?'style="color:var(--danger)"':''}>${rupiah(a.total)}</span></div>
        <div class="bar-track" style="margin-top:6px;"><div class="bar-fill" style="width:${(a.total/maxAging)*100}%;${i===2?'background:var(--danger);':''}"></div></div>
      </div>`).join('')}</div>

    <div class="section-title">Piutang per Pelanggan</div>
    ${d.pelanggan.length===0 ? '<div class="empty-state">Tidak ada piutang berjalan</div>' : `<div class="card">${d.pelanggan.map(x=>`
      <div class="margin-row">
        <div class="mr-top"><span class="mr-name">${esc(x.nama)}</span><span class="mr-laba" style="color:var(--danger);">${rupiah(x.total)}</span></div>
        <div class="mr-meta"><span>${x.jumlahTransaksi} transaksi</span><span class="pct ${x.umurTertua>30?'low':''}">tertua ${x.umurTertua} hari</span></div>
      </div>`).join('')}</div>`}

    <div class="section-title">Pelunasan Diterima</div>
    ${d.daftarPelunasan.length===0 ? '<div class="empty-state">Belum ada pelunasan di periode ini</div>' : `<div class="card">${d.daftarPelunasan.map(x=>`
      <div class="margin-row">
        <div class="mr-top"><span class="mr-name">${esc(x.NamaPelanggan)}</span><span class="mr-laba">${rupiah(x.Jumlah)}</span></div>
        <div class="mr-meta"><span>${fmtTanggalNota(x.Tanggal)} · transaksi #${x.TransaksiID}</span></div>
      </div>`).join('')}</div>`}

    <div style="font-size:11px;color:var(--ink-soft);margin-top:14px;line-height:1.5;">Total piutang, umur piutang, dan daftar per pelanggan selalu menunjukkan kondisi hari ini. Piutang baru dan pelunasan mengikuti rentang tanggal yang dipilih. Umur dihitung sejak tanggal transaksi. Lebih dari 30 hari ditandai merah.</div>
  `;
}

function tampilkanLaporanStok(){
  const d = state.laporanStok; if(!d) return;
  const filters = ['Semua','Habis','Menipis','Aman'];
  const f = state.stokFilter;
  const items = d.items.filter(i=> f==='Semua' || i.status===f.toLowerCase());
  const ada = !!(state.laporanRange.mulai || state.laporanRange.sampai);
  el('lap-hasil').innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="label">Nilai Persediaan</div><div class="value">${rupiah(d.totalNilai)}</div><div class="sub">stok × harga beli</div></div>
      <div class="stat-card accent"><div class="label">Jenis Barang</div><div class="value">${d.jumlahBarang}</div><div class="sub">${d.habis} habis · ${d.menipis} menipis</div></div>
    </div>
    <div class="chips">${filters.map(k=>`<button class="chip ${k===f?'active':''}" data-f="${k}">${k}</button>`).join('')}</div>
    ${items.length===0 ? '<div class="empty-state">Tidak ada barang di kategori status ini</div>' : items.map(i=>`
      <div class="card">
        <div class="row-between" style="gap:10px;">
          <div style="min-width:0;">
            <div style="font-weight:600;font-size:14px;">${esc(i.nama)}</div>
            <div style="font-size:11px;color:var(--ink-soft);margin-top:3px;">${esc(i.kategori||'-')} · Nilai ${rupiah(i.nilai)}</div>
          </div>
          <div style="text-align:right;flex-shrink:0;">
            <div class="stok-big">${i.stokAkhir}<span style="font-size:11px;color:var(--ink-soft);font-family:var(--font-body);font-weight:500;"> ${esc(i.satuan||'')}</span></div>
            <span class="stok-pill ${i.status}">${i.status}</span>
          </div>
        </div>
        <div class="mv-line">
          <span>Awal ${i.stokAwal}</span>
          <span class="plus">Masuk +${i.masuk}</span>
          <span class="minus">Keluar −${i.keluar}</span>
        </div>
      </div>`).join('')}
    <div style="font-size:11px;color:var(--ink-soft);margin-top:14px;line-height:1.5;">${ada?'Stok akhir dihitung per akhir periode yang dipilih.':'Tanggal kosong = stok saat ini.'} Menipis = stok 5 atau kurang. Perubahan stok manual lewat Edit Barang tidak tercatat sebagai barang masuk/keluar, jadi bisa membuat angka Awal tidak sama dengan kenyataan.</div>
  `;
  el('lap-hasil').querySelectorAll('.chip').forEach(c=> c.addEventListener('click', ()=>{ state.stokFilter=c.dataset.f; tampilkanLaporanStok(); }));
}

function pct(n){ return Number(n).toFixed(1).replace('.',',')+'%'; }
function pctClass(n){ return n<10 ? 'low' : (n>=25 ? 'good' : ''); }

function tampilkanLaporan(){
  const d = state.laporan;
  const rekap = d.rekapBarang || [];
  const harian = d.perHari || [];
  const maxQty = Math.max(1, ...d.terlaris.map(t=>t.qty));
  el('lap-hasil').innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="label">Total Penjualan</div><div class="value">${rupiah(d.totalPenjualan)}</div><div class="sub">${d.jumlahTransaksi} transaksi</div></div>
      <div class="stat-card accent"><div class="label">Laba Kotor</div><div class="value">${rupiah(d.totalLaba)}</div><div class="sub">Margin ${pct(d.marginPersen)}</div></div>
      <div class="stat-card light"><div class="label">Modal Barang Terjual</div><div class="value">${rupiah(d.totalModal)}</div></div>
      <div class="stat-card light"><div class="label">Rata-rata / Transaksi</div><div class="value">${rupiah(d.rataRata)}</div></div>
    </div>

    <div class="card"><div class="row-between"><span style="font-size:13px;color:var(--ink-soft);">Belum tertagih (piutang transaksi periode ini)</span><span class="mono" style="font-weight:600;color:${(d.belumTertagih||0)>0?'var(--danger)':'var(--ink)'};">${rupiah(d.belumTertagih||0)}</span></div></div>

    <div class="section-title">Rekap Margin per Barang</div>
    ${rekap.length===0 ? '<div class="empty-state">Belum ada penjualan di rentang ini</div>' : `<div class="card">${rekap.map(r=>`
      <div class="margin-row">
        <div class="mr-top"><span class="mr-name">${r.nama}</span><span class="mr-laba">${rupiah(r.laba)}</span></div>
        <div class="mr-meta"><span>${r.qty} terjual · Omzet ${rupiah(r.penjualan)}</span><span class="pct ${pctClass(r.margin)}">${pct(r.margin)}</span></div>
      </div>`).join('')}</div>`}

    <div class="section-title">Laba per Hari</div>
    ${harian.length===0 ? '<div class="empty-state">Belum ada data</div>' : `<div class="card">${harian.map(h=>`
      <div class="margin-row">
        <div class="mr-top"><span class="mr-name">${new Date(h.tanggal+'T00:00:00').toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'})}</span><span class="mr-laba">${rupiah(h.laba)}</span></div>
        <div class="mr-meta"><span>Omzet ${rupiah(h.penjualan)}</span><span class="pct ${pctClass(h.margin)}">${pct(h.margin)}</span></div>
      </div>`).join('')}</div>`}

    <div class="section-title">Barang Terlaris</div>
    ${d.terlaris.length===0?'<div class="empty-state">Belum ada data</div>':d.terlaris.map(t=>`
      <div class="bar-row">
        <div class="bar-label">${t.nama}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(t.qty/maxQty)*100}%"></div></div>
        <div class="bar-val mono">${t.qty}x</div>
      </div>
    `).join('')}
    <div style="font-size:11px;color:var(--ink-soft);margin-top:14px;line-height:1.5;">Laba kotor = omzet − harga beli barang yang terjual. Belum dikurangi biaya operasional (sewa, listrik, gaji). Omzet dan laba dihitung dari nilai penjualan, termasuk yang masih berupa piutang. Margin di bawah 10% ditandai merah, 25% ke atas hijau.</div>
  `;
}

/* ======================= RIWAYAT VIEW ======================= */
function renderRiwayat(){
  el('cart-bar').classList.add('hidden');
  if(el('fab-barang')) el('fab-barang').classList.add('hidden');
  el('content').innerHTML = `<div class="empty-state">Memuat riwayat...</div>`;
  muatRiwayat();
}

async function muatRiwayat(){
  let res;
  try{ res = await apiGet('getTransaksi'); }catch(err){ showToast('Gagal memuat riwayat'); res = {data:[]}; }
  state.riwayat = res.data || [];
  el('content').innerHTML = state.riwayat.length===0 ? '<div class="empty-state">Belum ada transaksi</div>' :
    state.riwayat.map(t=>`
      <div class="card riwayat-card" data-id="${t.ID}" style="cursor:pointer;">
        <div class="row-between">
          <div>
            <div style="font-weight:600;font-size:13.5px;">Transaksi #${t.ID}</div>
            <div style="font-size:11px;color:var(--ink-soft);margin-top:2px;">${new Date(t.Tanggal).toLocaleString('id-ID')} · ${esc(t.Kasir)}</div>
            ${Number(t.Sisa)>0 ? `<div style="margin-top:6px;"><span class="stok-pill menipis">Piutang ${rupiah(t.Sisa)} · ${esc(t.NamaPelanggan)}</span></div>` : ''}
          </div>
          <div class="mono" style="font-weight:700;color:var(--primary);">${rupiah(t.TotalBayar)}</div>
        </div>
        <div style="margin-top:8px;font-size:12px;font-weight:600;color:var(--primary-light);">🖨 Lihat & cetak nota</div>
      </div>
    `).join('');
  el('content').querySelectorAll('.riwayat-card').forEach(c=> c.addEventListener('click', ()=> bukaNota(c.dataset.id)));
}

async function bukaNota(id){
  showToast('Memuat nota...');
  try{
    const res = await apiGet('getNota', {id});
    if(res.success) openNotaSheet(res.data, 'ulang');
    else showToast(res.message || 'Nota tidak ditemukan');
  }catch(err){ showToast('Gagal menghubungi server'); }
}

/* ======================= NOTA ======================= */
function fmtTanggalNota(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('id-ID') + ' ' + d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
}

function notaHtml(n, ulang){
  const kredit = !!n.kredit;
  const sisa = Number(n.sisa)||0;
  const pelunasan = n.pelunasan || [];
  return `<div class="nota">
    <div class="c b big">${esc(TOKO.nama)}</div>
    ${TOKO.alamat?`<div class="c">${esc(TOKO.alamat)}</div>`:''}
    ${TOKO.telp?`<div class="c">${esc(TOKO.telp)}</div>`:''}
    <hr>
    <div class="r"><span>No</span><span>#${n.id}</span></div>
    <div class="r"><span>Tanggal</span><span>${fmtTanggalNota(n.tanggal)}</span></div>
    <div class="r"><span>Kasir</span><span>${esc(n.kasir)}</span></div>
    ${n.pelanggan?`<div class="r"><span>Pelanggan</span><span>${esc(n.pelanggan)}</span></div>`:''}
    <hr>
    ${n.items.map(i=>`<div class="it"><div>${esc(i.nama)}</div><div class="r"><span>${i.qty} x ${rupiah(i.harga)}</span><span>${rupiah(i.subtotal)}</span></div></div>`).join('')}
    <hr>
    <div class="r b big"><span>TOTAL</span><span>${rupiah(n.total)}</span></div>
    <div class="r"><span>Bayar</span><span>${rupiah(n.bayar)}</span></div>
    ${pelunasan.map(x=>`<div class="r"><span>Pelunasan ${new Date(x.tanggal).toLocaleDateString('id-ID')}</span><span>${rupiah(x.jumlah)}</span></div>`).join('')}
    ${kredit
      ? (sisa>0 ? `<div class="r b big"><span>SISA PIUTANG</span><span>${rupiah(sisa)}</span></div>` : '')
      : `<div class="r"><span>Kembali</span><span>${rupiah(n.kembalian)}</span></div>`}
    <hr>
    <div class="c">${esc(TOKO.footer)}</div>
    ${kredit ? `<div class="c b" style="margin-top:6px;">${sisa>0 ? '*** BELUM LUNAS ***' : '*** LUNAS ***'}</div>` : ''}
    ${ulang?'<div class="c" style="margin-top:6px;">*** SALINAN NOTA ***</div>':''}
  </div>`;
}

function cetakNota(n, ulang){
  const pa = el('print-area');
  pa.style.width = TOKO.lebarKertas;
  pa.innerHTML = notaHtml(n, ulang);
  try{ window.print(); }catch(err){ showToast('Browser ini belum mendukung cetak'); }
}

function openNotaSheet(n, mode){
  const ulang = (mode==='ulang');
  const barisHasil = ulang ? '' : (n.kredit
    ? `<div class="pay-row kembalian"><span>Sisa piutang${n.pelanggan?' · '+esc(n.pelanggan):''}</span><span class="val mono">${rupiah(n.sisa)}</span></div>`
    : `<div class="pay-row kembalian"><span>Kembalian</span><span class="val mono">${rupiah(n.kembalian)}</span></div>`);
  el('sheet-root').innerHTML = `
    <div class="overlay" id="nota-overlay">
      <div class="sheet">
        <button class="close-sheet" id="close-nota">✕</button>
        <div class="sheet-handle"></div>
        <h2>${ulang ? 'Nota #'+n.id : 'Transaksi Berhasil'}</h2>
        ${barisHasil}
        ${notaHtml(n, ulang)}
        <button class="btn-primary" id="print-nota-btn">🖨 Cetak Nota</button>
        <button class="btn-secondary" id="done-nota-btn">${ulang ? 'Tutup' : 'Transaksi Baru'}</button>
      </div>
    </div>
  `;
  const tutup = ()=>{ el('sheet-root').innerHTML=''; };
  el('close-nota').addEventListener('click', tutup);
  el('done-nota-btn').addEventListener('click', tutup);
  el('nota-overlay').addEventListener('click', (e)=>{ if(e.target.id==='nota-overlay') tutup(); });
  el('print-nota-btn').addEventListener('click', ()=> cetakNota(n, ulang));
}

/* ======================= SERVICE WORKER ======================= */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
