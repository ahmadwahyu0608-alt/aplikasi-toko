<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Toko Kasir</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B4332">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F4EF; --surface:#FFFFFF; --surface-2:#ECE9DE;
    --ink:#1C1C1A; --ink-soft:#6E6C61;
    --primary:#1B4332; --primary-light:#2D6A4F;
    --accent:#C89B3C; --accent-soft:#F1E2BB;
    --danger:#B3261E; --border:#E2DFD2;
    --radius:16px;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-tap-highlight-color:transparent;}
  #app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden;}
  h1,h2,h3{font-family:var(--font-display);margin:0;}
  button{font-family:var(--font-body);cursor:pointer;border:none;}
  input,select{font-family:var(--font-body);}
  .mono{font-family:var(--font-mono);}
  .hidden{display:none !important;}

  /* ---------- LOGIN ---------- */
  #login-view{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;background:var(--primary);}
  .login-card{background:var(--surface);border-radius:24px;padding:32px 24px;width:100%;box-shadow:0 20px 40px rgba(0,0,0,.25);}
  .login-logo{width:56px;height:56px;margin:0 auto 16px;display:block;}
  .login-card h1{text-align:center;font-size:22px;color:var(--primary);margin-bottom:4px;}
  .login-card p{text-align:center;color:var(--ink-soft);font-size:13px;margin:0 0 24px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
  .field input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;background:var(--bg);}
  .field input:focus{outline:none;border-color:var(--primary-light);}
  .btn-primary{width:100%;padding:13px;background:var(--primary);color:#fff;border-radius:10px;font-weight:600;font-size:15px;margin-top:6px;}
  .btn-primary:active{background:var(--primary-light);}
  .btn-primary:disabled{opacity:.5;}
  .login-error{color:var(--danger);font-size:13px;margin-top:10px;text-align:center;}
  .login-hint{margin-top:18px;font-size:11px;color:var(--ink-soft);text-align:center;line-height:1.6;}

  /* ---------- TOPBAR ---------- */
  .topbar{background:var(--primary);color:#fff;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  .topbar .brand{font-family:var(--font-display);font-size:17px;font-weight:600;}
  .topbar .role-badge{font-size:10px;background:rgba(255,255,255,.15);padding:3px 9px;border-radius:20px;margin-left:8px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;vertical-align:middle;}
  .topbar .logout{background:none;color:rgba(255,255,255,.85);font-size:13px;font-weight:600;padding:6px;}

  /* ---------- CONTENT ---------- */
  #content{flex:1;overflow-y:auto;padding:16px;padding-bottom:90px;}

  /* ---------- KASIR: search + chips ---------- */
  .search-box{position:relative;margin-bottom:12px;}
  .search-box input{width:100%;padding:11px 14px 11px 38px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);font-size:14px;}
  .search-box::before{content:'⌕';position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-size:16px;}
  .chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;}
  .chip{flex-shrink:0;padding:6px 14px;border-radius:20px;background:var(--surface-2);color:var(--ink-soft);font-size:12.5px;font-weight:600;border:1.5px solid transparent;}
  .chip.active{background:var(--primary);color:#fff;}

  .product-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .product-card{background:var(--surface);border-radius:var(--radius);padding:12px;border:1px solid var(--border);position:relative;}
  .product-card .pname{font-weight:600;font-size:13.5px;line-height:1.3;min-height:35px;}
  .product-card .pstock{font-size:10.5px;color:var(--ink-soft);margin-top:4px;}
  .product-card .pstock.low{color:var(--danger);font-weight:600;}
  .product-card .pprice{font-family:var(--font-mono);font-weight:600;color:var(--primary);margin-top:8px;font-size:14px;}
  .product-card .add-btn{position:absolute;right:10px;bottom:10px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-size:18px;line-height:1;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .product-card .add-btn:active{background:var(--primary);}
  .product-card.out-of-stock{opacity:.5;}
  .product-card.out-of-stock .add-btn{background:var(--ink-soft);pointer-events:none;}

  .empty-state{text-align:center;color:var(--ink-soft);padding:60px 20px;font-size:14px;}

  /* ---------- FLOATING CART BAR ---------- */
  #cart-bar{position:absolute;left:0;right:0;bottom:64px;max-width:480px;margin:0 auto;background:var(--primary);color:#fff;padding:13px 18px;display:flex;justify-content:space-between;align-items:center;border-radius:14px 14px 0 0;box-shadow:0 -6px 18px rgba(0,0,0,.15);}
  #cart-bar .cart-count{font-size:12px;opacity:.85;}
  #cart-bar .cart-total{font-family:var(--font-mono);font-weight:600;font-size:16px;}
  #cart-bar button{background:var(--accent);color:#fff;padding:8px 16px;border-radius:8px;font-weight:600;font-size:13px;}

  /* ---------- BOTTOM NAV ---------- */
  #bottom-nav{flex-shrink:0;display:flex;background:var(--surface);border-top:1px solid var(--border);height:64px;}
  #bottom-nav button{flex:1;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-soft);font-size:10.5px;font-weight:600;}
  #bottom-nav button .icon{font-size:19px;}
  #bottom-nav button.active{color:var(--primary);}

  /* ---------- SHEET / MODAL ---------- */
  .overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;z-index:20;}
  .sheet{background:var(--bg);width:100%;max-height:88%;border-radius:20px 20px 0 0;padding:18px;overflow-y:auto;}
  .sheet-handle{width:36px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 14px;}
  .sheet h2{font-size:18px;margin-bottom:14px;}

  /* receipt-style cart list */
  .receipt{background:var(--surface);border-radius:10px 10px 0 0;padding:14px 16px 20px;position:relative;margin-bottom:14px;}
  .receipt::after{content:'';position:absolute;left:0;right:0;bottom:-9px;height:18px;
    background:
      linear-gradient(-45deg, var(--bg) 9px, transparent 0) 0 0/18px 18px,
      linear-gradient(45deg, var(--bg) 9px, transparent 0) 0 0/18px 18px;
    background-color:var(--surface);
  }
  .receipt-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--border);gap:8px;}
  .receipt-item:last-child{border-bottom:none;}
  .ri-name{font-size:13px;font-weight:600;flex:1;}
  .ri-qty{display:flex;align-items:center;gap:8px;}
  .ri-qty button{width:24px;height:24px;border-radius:50%;background:var(--surface-2);font-weight:700;color:var(--primary);}
  .ri-qty span{font-family:var(--font-mono);font-size:13px;min-width:16px;text-align:center;}
  .ri-sub{font-family:var(--font-mono);font-size:13px;font-weight:600;min-width:70px;text-align:right;}
  .receipt-total{display:flex;justify-content:space-between;align-items:center;padding-top:24px;font-weight:700;}
  .receipt-total .val{font-family:var(--font-mono);font-size:18px;color:var(--primary);}

  .pay-row{display:flex;justify-content:space-between;padding:10px 0;font-size:14px;}
  .pay-row .val{font-family:var(--font-mono);font-weight:600;}
  .pay-row.kembalian .val{color:var(--accent);font-size:17px;}

  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}

  .icon-btn-small{background:none;color:var(--ink-soft);font-size:13px;padding:6px;text-decoration:underline;}

  .close-sheet{position:absolute;right:16px;top:14px;background:none;font-size:20px;color:var(--ink-soft);}

  /* ---------- CARDS / TABLES generic ---------- */
  .card{background:var(--surface);border-radius:var(--radius);padding:14px 16px;border:1px solid var(--border);margin-bottom:10px;}
  .row-between{display:flex;justify-content:space-between;align-items:center;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .stat-card{background:var(--primary);color:#fff;border-radius:var(--radius);padding:14px;}
  .stat-card .label{font-size:11px;opacity:.8;margin-bottom:4px;}
  .stat-card .value{font-family:var(--font-mono);font-size:18px;font-weight:600;}
  .stat-card.accent{background:var(--accent);}

  .section-title{font-size:13px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .bar-row .bar-label{width:76px;font-size:11px;color:var(--ink-soft);flex-shrink:0;}
  .bar-track{flex:1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--primary);border-radius:4px;}
  .bar-row .bar-val{font-family:var(--font-mono);font-size:11.5px;width:60px;text-align:right;flex-shrink:0;}

  .stat-grid.three{grid-template-columns:1fr 1fr;}
  .stat-card.light{background:var(--surface);color:var(--ink);border:1px solid var(--border);}
  .stat-card.light .label{color:var(--ink-soft);opacity:1;}
  .stat-card .sub{font-size:11px;opacity:.85;margin-top:3px;}
  .margin-row{padding:10px 0;border-bottom:1px dashed var(--border);}
  .margin-row:last-child{border-bottom:none;}
  .margin-row .mr-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .margin-row .mr-name{font-size:13px;font-weight:600;}
  .margin-row .mr-laba{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--primary);}
  .margin-row .mr-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);margin-top:3px;}
  .margin-row .mr-meta .pct{font-family:var(--font-mono);font-weight:600;}
  .pct.low{color:var(--danger);}
  .pct.good{color:var(--primary-light);}
  .fab{position:absolute;right:18px;bottom:80px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;font-size:26px;box-shadow:0 8px 20px rgba(0,0,0,.25);z-index:15;}

  .badge{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--surface-2);color:var(--ink-soft);font-weight:600;}

  .toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:50;box-shadow:0 8px 20px rgba(0,0,0,.2);}
</style>
</head>
<body>
<div id="app">

  <!-- LOGIN -->
  <div id="login-view">
    <div class="login-card">
      <svg class="login-logo" viewBox="0 0 192 192"><rect width="192" height="192" rx="36" fill="#1B4332"/><path d="M50 70h92l-8 62a10 10 0 0 1-10 8.6H68a10 10 0 0 1-10-8.6L50 70Z" fill="#F7F7F4"/><path d="M66 70v-8a30 30 0 0 1 60 0v8" stroke="#C89B3C" stroke-width="9" fill="none" stroke-linecap="round"/><circle cx="80" cy="98" r="6" fill="#C89B3C"/><circle cx="112" cy="98" r="6" fill="#C89B3C"/></svg>
      <h1>Toko Kasir</h1>
      <p>Masuk untuk mulai transaksi</p>
      <div class="field"><label>Username</label><input id="login-username" autocomplete="username"></div>
      <div class="field"><label>Password</label><input id="login-password" type="password" autocomplete="current-password"></div>
      <button class="btn-primary" id="login-btn">Masuk</button>
      <div class="login-error hidden" id="login-error"></div>
      <button class="btn-primary" id="demo-btn" style="background:var(--accent);">Coba mode demo (tanpa Google Sheet)</button>
      <div class="login-hint">Mode demo memakai data contoh. Untuk data asli, atur <code>API_URL</code> di bagian atas script.<br>Di mode demo, login juga bisa pakai <b>owner/owner123</b> atau <b>kasir/kasir123</b>.</div>
    </div>
  </div>

  <!-- MAIN -->
  <div id="main-view" class="hidden" style="display:flex;flex-direction:column;height:100%;">
    <div class="topbar">
      <div><span class="brand" id="topbar-title">Kasir</span><span class="role-badge" id="topbar-role"></span></div>
      <button class="logout" id="logout-btn">Keluar</button>
    </div>
    <div id="content"></div>
    <div id="cart-bar" class="hidden">
      <div><div class="cart-count" id="cart-count">0 item</div><div class="cart-total mono" id="cart-total">Rp0</div></div>
      <button id="open-cart-btn">Lihat Keranjang</button>
    </div>
    <div id="bottom-nav"></div>
  </div>

  <div id="sheet-root"></div>
  <div id="toast-root"></div>
</div>

<script>
/* ======================= KONFIGURASI ======================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbwK7l1g2lMSREF01zU0z9Ceto2UzKbhBWqQplTmiQjRB4yYOkGNJLiL0ZKcCLGXsgG5/exec';

/* ======================= STATE ======================= */
let state = {
  user: null,
  barang: [],
  cart: [],
  view: 'kasir',
  search: '',
  kategori: 'Semua',
  laporan: null,
  laporanRange: { mulai: '', sampai: '' },
  riwayat: []
};

/* ======================= HELPERS ======================= */
function rupiah(n){ return 'Rp' + Math.round(Number(n)||0).toLocaleString('id-ID'); }
function el(id){ return document.getElementById(id); }
function showToast(msg){
  const root = el('toast-root');
  root.innerHTML = `<div class="toast">${msg}</div>`;
  setTimeout(()=>{ root.innerHTML=''; }, 2200);
}

/* ---------- MODE DEMO (data contoh di memori) ---------- */
let DEMO = false;
const demoDB = {
  users:[
    {Username:'owner',Password:'owner123',Nama:'Pemilik Toko',Role:'owner'},
    {Username:'kasir',Password:'kasir123',Nama:'Kasir 1',Role:'kasir'}
  ],
  barang:[
    {ID:1,Nama:'Indomie Goreng',Kategori:'Makanan',HargaBeli:2500,HargaJual:3000,Stok:48,Satuan:'pcs'},
    {ID:2,Nama:'Aqua 600ml',Kategori:'Minuman',HargaBeli:2800,HargaJual:4000,Stok:30,Satuan:'btl'},
    {ID:3,Nama:'Teh Botol Sosro',Kategori:'Minuman',HargaBeli:4000,HargaJual:5500,Stok:20,Satuan:'btl'},
    {ID:4,Nama:'Beras 5kg',Kategori:'Sembako',HargaBeli:58000,HargaJual:65000,Stok:12,Satuan:'karung'},
    {ID:5,Nama:'Minyak Goreng 1L',Kategori:'Sembako',HargaBeli:16000,HargaJual:18500,Stok:4,Satuan:'btl'},
    {ID:6,Nama:'Gula Pasir 1kg',Kategori:'Sembako',HargaBeli:14000,HargaJual:16000,Stok:15,Satuan:'kg'},
    {ID:7,Nama:'Kopi Kapal Api',Kategori:'Minuman',HargaBeli:1200,HargaJual:2000,Stok:60,Satuan:'sachet'},
    {ID:8,Nama:'Sabun Lifebuoy',Kategori:'Kebersihan',HargaBeli:3000,HargaJual:4000,Stok:0,Satuan:'pcs'}
  ],
  transaksi:[], detail:[]
};
(function seedDemo(){
  const d=demoDB; let tid=1, did=1;
  const plan=[[0,[[1,5],[2,2]]],[1,[[4,1],[7,6]]],[1,[[3,3],[6,2]]],[2,[[1,10],[7,8]]],[3,[[5,1],[2,4]]],[4,[[4,2],[6,1],[3,2]]],[5,[[2,6],[1,4]]]];
  plan.forEach(([hari,items])=>{
    const tgl=new Date(Date.now()-hari*86400000).toISOString();
    let total=0;
    items.forEach(([bid,qty])=>{
      const b=d.barang.find(x=>x.ID===bid);
      d.detail.push({ID:did++,TransaksiID:tid,BarangID:bid,NamaBarang:b.Nama,Qty:qty,HargaSatuan:b.HargaJual,Subtotal:qty*b.HargaJual,HargaBeli:b.HargaBeli});
      total+=qty*b.HargaJual;
    });
    d.transaksi.push({ID:tid,Tanggal:tgl,Kasir:'Kasir 1',TotalItem:items.length,TotalBayar:total,Bayar:total,Kembalian:0});
    tid++;
  });
})();

function demoApi(action, p){
  const d = demoDB;
  const nextId = a => a.reduce((m,x)=>Math.max(m,Number(x.ID)||0),0)+1;
  if(action==='login'){
    const u = d.users.find(x=>x.Username===p.username && x.Password===p.password);
    return u ? {success:true,nama:u.Nama,role:u.Role,username:u.Username} : {success:false,message:'Username atau password salah'};
  }
  if(action==='getBarang') return {success:true,data:d.barang.map(x=>({...x}))};
  if(action==='addBarang'){ const id=nextId(d.barang); d.barang.push({...p.barang,ID:id}); return {success:true,id}; }
  if(action==='updateBarang'){ const i=d.barang.findIndex(x=>Number(x.ID)===Number(p.barang.ID)); if(i<0) return {success:false,message:'Barang tidak ditemukan'}; d.barang[i]={...p.barang}; return {success:true}; }
  if(action==='deleteBarang'){ d.barang=d.barang.filter(x=>Number(x.ID)!==Number(p.id)); return {success:true}; }
  if(action==='checkout'){
    const total=p.items.reduce((s,i)=>s+i.qty*i.harga,0);
    if(p.bayar<total) return {success:false,message:'Uang bayar kurang dari total'};
    const id=nextId(d.transaksi);
    d.transaksi.push({ID:id,Tanggal:new Date().toISOString(),Kasir:p.kasir,TotalItem:p.items.length,TotalBayar:total,Bayar:p.bayar,Kembalian:p.bayar-total});
    p.items.forEach(i=>{
      d.detail.push({ID:nextId(d.detail),TransaksiID:id,BarangID:i.id,NamaBarang:i.nama,Qty:i.qty,HargaSatuan:i.harga,Subtotal:i.qty*i.harga,HargaBeli:(d.barang.find(x=>Number(x.ID)===Number(i.id))||{}).HargaBeli||0});
      const b=d.barang.find(x=>Number(x.ID)===Number(i.id)); if(b) b.Stok=Number(b.Stok)-i.qty;
    });
    return {success:true,transaksiId:id,total,kembalian:p.bayar-total};
  }
  if(action==='getTransaksi') return {success:true,data:[...d.transaksi].reverse()};
  if(action==='getLaporan'){
    const tr=d.transaksi.filter(t=>{
      const day=t.Tanggal.slice(0,10);
      return (!p.mulai||day>=p.mulai)&&(!p.sampai||day<=p.sampai);
    });
    const byId={}; tr.forEach(t=>byId[t.ID]=t);
    const det=d.detail.filter(x=>byId[x.TransaksiID]);
    const pb={}, ph={}; let tp=0, tm=0;
    det.forEach(x=>{
      const modal=x.HargaBeli*x.Qty;
      tp+=x.Subtotal; tm+=modal;
      const o=pb[x.NamaBarang]||(pb[x.NamaBarang]={nama:x.NamaBarang,qty:0,penjualan:0,modal:0});
      o.qty+=x.Qty; o.penjualan+=x.Subtotal; o.modal+=modal;
      const day=byId[x.TransaksiID].Tanggal.slice(0,10);
      const h=ph[day]||(ph[day]={tanggal:day,penjualan:0,modal:0});
      h.penjualan+=x.Subtotal; h.modal+=modal;
    });
    const hit=o=>{o.laba=o.penjualan-o.modal;o.margin=o.penjualan?Math.round(o.laba/o.penjualan*1000)/10:0;return o;};
    const rekap=Object.values(pb).map(hit).sort((a,b)=>b.laba-a.laba);
    return {success:true,data:{totalPenjualan:tp,totalModal:tm,totalLaba:tp-tm,marginPersen:tp?Math.round((tp-tm)/tp*1000)/10:0,jumlahTransaksi:tr.length,rataRata:tr.length?Math.round(tp/tr.length):0,terlaris:[...rekap].sort((a,b)=>b.qty-a.qty).slice(0,10),rekapBarang:rekap,perHari:Object.keys(ph).sort().map(k=>hit(ph[k]))}};
  }
  return {success:false,message:'Aksi tidak dikenal'};
}

async function apiGet(action, params={}){
  if(DEMO) return demoApi(action, params);
  const qs = new URLSearchParams({action, ...params}).toString();
  const res = await fetch(`${API_URL}?${qs}`);
  return res.json();
}
async function apiPost(action, payload={}){
  if(DEMO) return demoApi(action, payload);
  const res = await fetch(API_URL, {
    method:'POST',
    headers: {'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action, ...payload})
  });
  return res.json();
}

/* ======================= LOGIN ======================= */
el('login-btn').addEventListener('click', doLogin);
el('demo-btn').addEventListener('click', ()=>{
  DEMO = true;
  el('login-username').value = 'owner';
  el('login-password').value = 'owner123';
  doLogin();
});
el('login-password').addEventListener('keydown', (e)=>{ if(e.key==='Enter') doLogin(); });

async function doLogin(){
  const username = el('login-username').value.trim();
  const password = el('login-password').value;
  const errBox = el('login-error');
  errBox.classList.add('hidden');
  if(!username || !password){ errBox.textContent='Isi username dan password'; errBox.classList.remove('hidden'); return; }
  if(!DEMO && API_URL.includes('PASTE_URL')){ errBox.textContent='API_URL belum diatur di dalam file index.html'; errBox.classList.remove('hidden'); return; }

  el('login-btn').disabled = true; el('login-btn').textContent = 'Memeriksa...';
  try{
    const res = await apiPost('login', {username, password});
    if(res.success){
      state.user = res;
      await bootMain();
    } else {
      errBox.textContent = res.message || 'Gagal masuk';
      errBox.classList.remove('hidden');
    }
  }catch(err){
    errBox.textContent = 'Tidak bisa menghubungi server. Cek API_URL & koneksi internet.';
    errBox.classList.remove('hidden');
  }
  el('login-btn').disabled = false; el('login-btn').textContent = 'Masuk';
}

el('logout-btn').addEventListener('click', ()=>{
  state.user = null; state.cart = [];
  el('main-view').classList.add('hidden');
  el('login-view').classList.remove('hidden');
});

/* ======================= BOOT ======================= */
async function bootMain(){
  el('login-view').classList.add('hidden');
  el('main-view').classList.remove('hidden');
  el('topbar-role').textContent = state.user.role;
  const data = await apiGet('getBarang');
  state.barang = data.data || [];
  setView('kasir');
}

/* ======================= NAV ======================= */
function navItems(){
  if(state.user.role === 'owner'){
    return [
      {id:'kasir', label:'Kasir', icon:'🛒'},
      {id:'barang', label:'Barang', icon:'📦'},
      {id:'laporan', label:'Laporan', icon:'📊'},
      {id:'riwayat', label:'Riwayat', icon:'🧾'}
    ];
  }
  return [
    {id:'kasir', label:'Kasir', icon:'🛒'},
    {id:'riwayat', label:'Riwayat', icon:'🧾'}
  ];
}

function renderNav(){
  const items = navItems();
  el('bottom-nav').innerHTML = items.map(it => `
    <button data-view="${it.id}" class="${state.view===it.id?'active':''}">
      <span class="icon">${it.icon}</span><span>${it.label}</span>
    </button>`).join('');
  el('bottom-nav').querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=> setView(btn.dataset.view));
  });
}

function setView(view){
  state.view = view;
  el('topbar-title').textContent = {kasir:'Kasir', barang:'Barang', laporan:'Laporan', riwayat:'Riwayat'}[view];
  renderNav();
  if(view==='kasir') renderKasir();
  if(view==='barang') renderBarang();
  if(view==='laporan') renderLaporan();
  if(view==='riwayat') renderRiwayat();
}

/* ======================= KASIR VIEW ======================= */
function renderKasir(){
  el('cart-bar').classList.toggle('hidden', state.cart.length===0);
  updateCartBar();

  const kategoris = ['Semua', ...new Set(state.barang.map(b=>b.Kategori).filter(Boolean))];
  const filtered = state.barang.filter(b=>{
    const matchSearch = b.Nama.toLowerCase().includes(state.search.toLowerCase());
    const matchKategori = state.kategori==='Semua' || b.Kategori===state.kategori;
    return matchSearch && matchKategori;
  });

  el('content').innerHTML = `
    <div class="search-box"><input id="search-input" placeholder="Cari barang..." value="${state.search}"></div>
    <div class="chips">${kategoris.map(k=>`<button class="chip ${k===state.kategori?'active':''}" data-k="${k}">${k}</button>`).join('')}</div>
    ${filtered.length===0 ? '<div class="empty-state">Barang tidak ditemukan.<br>Tambahkan barang dulu di tab Barang.</div>' : `
    <div class="product-grid">
      ${filtered.map(b=>{
        const stok = Number(b.Stok);
        return `<div class="product-card ${stok<=0?'out-of-stock':''}" data-id="${b.ID}">
          <div class="pname">${b.Nama}</div>
          <div class="pstock ${stok<=5?'low':''}">Stok: ${stok} ${b.Satuan||''}</div>
          <div class="pprice mono">${rupiah(b.HargaJual)}</div>
          <button class="add-btn" data-id="${b.ID}">+</button>
        </div>`;
      }).join('')}
    </div>`}
  `;

  el('search-input').addEventListener('input', (e)=>{ state.search = e.target.value; renderKasir(); });
  el('content').querySelectorAll('.chip').forEach(c=> c.addEventListener('click', ()=>{ state.kategori=c.dataset.k; renderKasir(); }));
  el('content').querySelectorAll('.add-btn').forEach(b=> b.addEventListener('click', ()=> addToCart(b.dataset.id)));
}

function addToCart(id){
  const barang = state.barang.find(b=> String(b.ID)===String(id));
  if(!barang || Number(barang.Stok)<=0) return;
  const existing = state.cart.find(c=> String(c.id)===String(id));
  const qtyInCart = existing ? existing.qty : 0;
  if(qtyInCart+1 > Number(barang.Stok)){ showToast('Stok tidak cukup'); return; }
  if(existing) existing.qty += 1;
  else state.cart.push({id: barang.ID, nama: barang.Nama, harga: Number(barang.HargaJual), qty:1, stokMax: Number(barang.Stok)});
  renderKasir();
}

function updateCartBar(){
  const totalItem = state.cart.reduce((s,c)=>s+c.qty,0);
  const total = state.cart.reduce((s,c)=>s+c.qty*c.harga,0);
  el('cart-count').textContent = `${totalItem} item`;
  el('cart-total').textContent = rupiah(total);
}

el('open-cart-btn').addEventListener('click', openCartSheet);

function openCartSheet(){
  const total = state.cart.reduce((s,c)=>s+c.qty*c.harga,0);
  el('sheet-root').innerHTML = `
    <div class="overlay" id="cart-overlay">
      <div class="sheet">
        <button class="close-sheet" id="close-cart">✕</button>
        <div class="sheet-handle"></div>
        <h2>Keranjang</h2>
        <div class="receipt">
          ${state.cart.map(c=>`
            <div class="receipt-item" data-id="${c.id}">
              <div class="ri-name">${c.nama}</div>
              <div class="ri-qty">
                <button class="qty-dec" data-id="${c.id}">−</button>
                <span>${c.qty}</span>
                <button class="qty-inc" data-id="${c.id}">+</button>
              </div>
              <div class="ri-sub mono">${rupiah(c.qty*c.harga)}</div>
            </div>`).join('')}
          <div class="receipt-total"><span>Total</span><span class="val mono">${rupiah(total)}</span></div>
        </div>
        <button class="btn-primary" id="checkout-btn" ${state.cart.length===0?'disabled':''}>Bayar</button>
      </div>
    </div>
  `;
  el('close-cart').addEventListener('click', ()=> el('sheet-root').innerHTML='');
  el('cart-overlay').addEventListener('click', (e)=>{ if(e.target.id==='cart-overlay') el('sheet-root').innerHTML=''; });
  el('sheet-root').querySelectorAll('.qty-inc').forEach(b=>b.addEventListener('click', ()=> changeQty(b.dataset.id, 1)));
  el('sheet-root').querySelectorAll('.qty-dec').forEach(b=>b.addEventListener('click', ()=> changeQty(b.dataset.id, -1)));
  el('checkout-btn').addEventListener('click', openPaymentSheet);
}

function changeQty(id, delta){
  const item = state.cart.find(c=> String(c.id)===String(id));
  if(!item) return;
  item.qty += delta;
  if(item.qty > item.stokMax){ item.qty = item.stokMax; showToast('Stok tidak cukup'); }
  if(item.qty <= 0) state.cart = state.cart.filter(c=> String(c.id)!==String(id));
  renderKasir();
  openCartSheet();
}

function openPaymentSheet(){
  const total = state.cart.reduce((s,c)=>s+c.qty*c.harga,0);
  el('sheet-root').innerHTML = `
    <div class="overlay" id="pay-overlay">
      <div class="sheet">
        <button class="close-sheet" id="close-pay">✕</button>
        <div class="sheet-handle"></div>
        <h2>Pembayaran</h2>
        <div class="pay-row"><span>Total belanja</span><span class="val mono">${rupiah(total)}</span></div>
        <div class="field"><label>Uang diterima</label><input id="bayar-input" inputmode="numeric" placeholder="0"></div>
        <div class="pay-row kembalian"><span>Kembalian</span><span class="val mono" id="kembalian-val">Rp0</span></div>
        <button class="btn-primary" id="confirm-pay-btn">Selesaikan Transaksi</button>
      </div>
    </div>
  `;
  el('close-pay').addEventListener('click', ()=> el('sheet-root').innerHTML='');
  el('pay-overlay').addEventListener('click', (e)=>{ if(e.target.id==='pay-overlay') el('sheet-root').innerHTML=''; });
  el('bayar-input').addEventListener('input', (e)=>{
    const bayar = Number(e.target.value.replace(/\D/g,'')) || 0;
    el('kembalian-val').textContent = rupiah(Math.max(bayar-total,0));
  });
  el('confirm-pay-btn').addEventListener('click', ()=> finalisasiTransaksi(total));
}

async function finalisasiTransaksi(total){
  const bayar = Number(el('bayar-input').value.replace(/\D/g,'')) || 0;
  if(bayar < total){ showToast('Uang diterima kurang dari total'); return; }
  el('confirm-pay-btn').disabled = true; el('confirm-pay-btn').textContent = 'Memproses...';
  try{
    const res = await apiPost('checkout', {
      kasir: state.user.nama,
      items: state.cart.map(c=>({id:c.id, nama:c.nama, qty:c.qty, harga:c.harga})),
      bayar
    });
    if(res.success){
      state.cart.forEach(c=>{
        const b = state.barang.find(x=> String(x.ID)===String(c.id));
        if(b) b.Stok = Number(b.Stok) - c.qty;
      });
      state.cart = [];
      el('sheet-root').innerHTML = '';
      showToast(`Transaksi berhasil · Kembalian ${rupiah(res.kembalian)}`);
      renderKasir();
    } else {
      showToast(res.message || 'Transaksi gagal');
    }
  }catch(err){
    showToast('Gagal menghubungi server');
  }
  const btn = el('confirm-pay-btn');
  if(btn){ btn.disabled=false; btn.textContent='Selesaikan Transaksi'; }
}

/* ======================= BARANG VIEW ======================= */
function renderBarang(){
  el('cart-bar').classList.add('hidden');
  el('content').innerHTML = `
    ${state.barang.length===0 ? '<div class="empty-state">Belum ada barang.<br>Tekan tombol + untuk menambah.</div>' : state.barang.map(b=>`
      <div class="card">
        <div class="row-between">
          <div>
            <div style="font-weight:600;font-size:14px;">${b.Nama}</div>
            <div style="font-size:11px;color:var(--ink-soft);margin-top:3px;">${b.Kategori||'-'} · Stok ${b.Stok} ${b.Satuan||''}</div>
          </div>
          <div style="text-align:right;">
            <div class="mono" style="font-weight:600;color:var(--primary);">${rupiah(b.HargaJual)}</div>
          </div>
        </div>
        <div style="display:flex;gap:8px;margin-top:10px;">
          <button class="icon-btn-small" data-edit="${b.ID}">Edit</button>
          <button class="icon-btn-small" data-del="${b.ID}" style="color:var(--danger);">Hapus</button>
        </div>
      </div>
    `).join('')}
    <div style="height:40px;"></div>
  `;
  el('content').querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click', ()=> openBarangForm(b.dataset.edit)));
  el('content').querySelectorAll('[data-del]').forEach(b=> b.addEventListener('click', ()=> hapusBarang(b.dataset.del)));

  if(!el('fab-barang')){
    const fab = document.createElement('button');
    fab.className='fab'; fab.id='fab-barang'; fab.textContent='+';
    fab.addEventListener('click', ()=> openBarangForm());
    el('app').appendChild(fab);
  }
  el('fab-barang').classList.remove('hidden');
}

function openBarangForm(id){
  const existing = id ? state.barang.find(b=> String(b.ID)===String(id)) : null;
  el('sheet-root').innerHTML = `
    <div class="overlay" id="barang-overlay">
      <div class="sheet">
        <button class="close-sheet" id="close-barang">✕</button>
        <div class="sheet-handle"></div>
        <h2>${existing?'Edit Barang':'Tambah Barang'}</h2>
        <div class="field"><label>Nama barang</label><input id="f-nama" value="${existing?existing.Nama:''}"></div>
        <div class="field"><label>Kategori</label><input id="f-kategori" value="${existing?existing.Kategori||'':''}"></div>
        <div class="field-row">
          <div class="field"><label>Harga beli</label><input id="f-hargabeli" inputmode="numeric" value="${existing?existing.HargaBeli:''}"></div>
          <div class="field"><label>Harga jual</label><input id="f-hargajual" inputmode="numeric" value="${existing?existing.HargaJual:''}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Stok</label><input id="f-stok" inputmode="numeric" value="${existing?existing.Stok:''}"></div>
          <div class="field"><label>Satuan</label><input id="f-satuan" value="${existing?existing.Satuan||'pcs':'pcs'}"></div>
        </div>
        <button class="btn-primary" id="save-barang-btn">Simpan</button>
      </div>
    </div>
  `;
  el('close-barang').addEventListener('click', ()=> el('sheet-root').innerHTML='');
  el('barang-overlay').addEventListener('click', (e)=>{ if(e.target.id==='barang-overlay') el('sheet-root').innerHTML=''; });
  el('save-barang-btn').addEventListener('click', ()=> simpanBarang(existing));
}

async function simpanBarang(existing){
  const payload = {
    ID: existing?existing.ID:undefined,
    Nama: el('f-nama').value.trim(),
    Kategori: el('f-kategori').value.trim(),
    HargaBeli: Number(el('f-hargabeli').value)||0,
    HargaJual: Number(el('f-hargajual').value)||0,
    Stok: Number(el('f-stok').value)||0,
    Satuan: el('f-satuan').value.trim()||'pcs'
  };
  if(!payload.Nama){ showToast('Nama barang wajib diisi'); return; }
  const btn = el('save-barang-btn'); btn.disabled=true; btn.textContent='Menyimpan...';
  try{
    const res = existing ? await apiPost('updateBarang',{barang:payload}) : await apiPost('addBarang',{barang:payload});
    if(res.success){
      const data = await apiGet('getBarang');
      state.barang = data.data || [];
      el('sheet-root').innerHTML = '';
      showToast('Barang tersimpan');
      renderBarang();
    } else showToast(res.message || 'Gagal menyimpan');
  }catch(err){ showToast('Gagal menghubungi server'); }
  if(btn){ btn.disabled=false; btn.textContent='Simpan'; }
}

async function hapusBarang(id){
  if(!confirm('Hapus barang ini?')) return;
  const res = await apiPost('deleteBarang',{id});
  if(res.success){
    state.barang = state.barang.filter(b=> String(b.ID)!==String(id));
    showToast('Barang dihapus');
    renderBarang();
  } else showToast(res.message||'Gagal menghapus');
}

/* ======================= LAPORAN VIEW ======================= */
function renderLaporan(){
  el('cart-bar').classList.add('hidden');
  if(el('fab-barang')) el('fab-barang').classList.add('hidden');
  el('content').innerHTML = `
    <div class="field-row">
      <div class="field"><label>Dari tanggal</label><input type="date" id="lap-mulai" value="${state.laporanRange.mulai}"></div>
      <div class="field"><label>Sampai tanggal</label><input type="date" id="lap-sampai" value="${state.laporanRange.sampai}"></div>
    </div>
    <button class="btn-primary" id="lap-terapkan">Tampilkan Laporan</button>
    <div id="lap-hasil" style="margin-top:16px;"></div>
  `;
  el('lap-terapkan').addEventListener('click', muatLaporan);
  if(state.laporan) tampilkanLaporan();
}

async function muatLaporan(){
  state.laporanRange.mulai = el('lap-mulai').value;
  state.laporanRange.sampai = el('lap-sampai').value;
  el('lap-terapkan').textContent = 'Memuat...';
  const res = await apiGet('getLaporan', state.laporanRange);
  state.laporan = res.data;
  el('lap-terapkan').textContent = 'Tampilkan Laporan';
  tampilkanLaporan();
}

function pct(n){ return Number(n).toFixed(1).replace('.',',')+'%'; }
function pctClass(n){ return n<10 ? 'low' : (n>=25 ? 'good' : ''); }

function tampilkanLaporan(){
  const d = state.laporan;
  const rekap = d.rekapBarang || [];
  const harian = d.perHari || [];
  const maxQty = Math.max(1, ...d.terlaris.map(t=>t.qty));
  el('lap-hasil').innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="label">Total Penjualan</div><div class="value">${rupiah(d.totalPenjualan)}</div><div class="sub">${d.jumlahTransaksi} transaksi</div></div>
      <div class="stat-card accent"><div class="label">Laba Kotor</div><div class="value">${rupiah(d.totalLaba)}</div><div class="sub">Margin ${pct(d.marginPersen)}</div></div>
      <div class="stat-card light"><div class="label">Modal Barang Terjual</div><div class="value">${rupiah(d.totalModal)}</div></div>
      <div class="stat-card light"><div class="label">Rata-rata / Transaksi</div><div class="value">${rupiah(d.rataRata)}</div></div>
    </div>

    <div class="section-title">Rekap Margin per Barang</div>
    ${rekap.length===0 ? '<div class="empty-state">Belum ada penjualan di rentang ini</div>' : `<div class="card">${rekap.map(r=>`
      <div class="margin-row">
        <div class="mr-top"><span class="mr-name">${r.nama}</span><span class="mr-laba">${rupiah(r.laba)}</span></div>
        <div class="mr-meta"><span>${r.qty} terjual · Omzet ${rupiah(r.penjualan)}</span><span class="pct ${pctClass(r.margin)}">${pct(r.margin)}</span></div>
      </div>`).join('')}</div>`}

    <div class="section-title">Laba per Hari</div>
    ${harian.length===0 ? '<div class="empty-state">Belum ada data</div>' : `<div class="card">${harian.map(h=>`
      <div class="margin-row">
        <div class="mr-top"><span class="mr-name">${new Date(h.tanggal+'T00:00:00').toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'})}</span><span class="mr-laba">${rupiah(h.laba)}</span></div>
        <div class="mr-meta"><span>Omzet ${rupiah(h.penjualan)}</span><span class="pct ${pctClass(h.margin)}">${pct(h.margin)}</span></div>
      </div>`).join('')}</div>`}

    <div class="section-title">Barang Terlaris</div>
    ${d.terlaris.length===0?'<div class="empty-state">Belum ada data</div>':d.terlaris.map(t=>`
      <div class="bar-row">
        <div class="bar-label">${t.nama}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(t.qty/maxQty)*100}%"></div></div>
        <div class="bar-val mono">${t.qty}x</div>
      </div>
    `).join('')}
    <div style="font-size:11px;color:var(--ink-soft);margin-top:14px;line-height:1.5;">Laba kotor = omzet − harga beli barang yang terjual. Belum dikurangi biaya operasional (sewa, listrik, gaji). Margin di bawah 10% ditandai merah, 25% ke atas hijau.</div>
  `;
}

/* ======================= RIWAYAT VIEW ======================= */
function renderRiwayat(){
  el('cart-bar').classList.add('hidden');
  if(el('fab-barang')) el('fab-barang').classList.add('hidden');
  el('content').innerHTML = `<div class="empty-state">Memuat riwayat...</div>`;
  muatRiwayat();
}

async function muatRiwayat(){
  const res = await apiGet('getTransaksi');
  state.riwayat = res.data || [];
  el('content').innerHTML = state.riwayat.length===0 ? '<div class="empty-state">Belum ada transaksi</div>' :
    state.riwayat.map(t=>`
      <div class="card">
        <div class="row-between">
          <div>
            <div style="font-weight:600;font-size:13.5px;">Transaksi #${t.ID}</div>
            <div style="font-size:11px;color:var(--ink-soft);margin-top:2px;">${new Date(t.Tanggal).toLocaleString('id-ID')} · ${t.Kasir}</div>
          </div>
          <div class="mono" style="font-weight:700;color:var(--primary);">${rupiah(t.TotalBayar)}</div>
        </div>
      </div>
    `).join('');
}

/* ======================= SERVICE WORKER ======================= */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
